name: Exact builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      seed:
        type: boolean
        default: false

permissions:
  contents: write

env:
  EXACT_REF: f40a26b9d7c07b5a38de9ded2e5a82c65d920ab0
  SEED_TAG: exact-seed-v1-f40a26b9
  EXACT_FEEDBACK: "0"
  BUN_VERSION: "1.4.5"

jobs:
  release:
    if: inputs.seed || (github.event_name == 'push' && github.repository != 'disposabl-dev/disposabl-exact' && github.event.head_commit.message != 'Initial commit')
    runs-on: ubuntu-24.04
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ inputs.seed }}
        run: |
          if [[ "$SEED" == "true" ]]; then tag="$SEED_TAG"; else tag="build-$GITHUB_SHA"; fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "Automated build assets" --prerelease

  build:
    needs: release
    if: always() && (needs.release.result == 'success' || (needs.release.result == 'skipped' && !(github.event_name == 'push' && github.repository != 'disposabl-dev/disposabl-exact' && github.event.head_commit.message == 'Initial commit')))
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.platform == 'windows' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.seed || github.repository != 'disposabl-dev/disposabl-exact') && '[{"platform":"web","runner":"ubuntu-24.04"},{"platform":"android","runner":"ubuntu-24.04"},{"platform":"ios","runner":"xcode-27"}]' || '[{"platform":"web","runner":"ubuntu-24.04"},{"platform":"android","runner":"ubuntu-24.04"},{"platform":"linux","runner":"ubuntu-24.04"},{"platform":"ios","runner":"xcode-27"},{"platform":"macos","runner":"xcode-27"},{"platform":"windows","runner":"windows-2025"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare stable build directory
        run: |
          BUILD_ROOT="$RUNNER_TEMP/exact-work"
          echo "BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"
          echo "EXACT=$BUILD_ROOT/exact-sdk" >> "$GITHUB_ENV"
          mkdir -p "$BUILD_ROOT"
          cp -R "$GITHUB_WORKSPACE/apps" "$BUILD_ROOT/"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Fetch Exact
        run: |
          EXACT="${EXACT//\\//}"
          echo "EXACT=$EXACT" >> "$GITHUB_ENV"
          git init "$EXACT"
          git -C "$EXACT" fetch --depth 1 https://github.com/expo/exact.git "$EXACT_REF"
          git -C "$EXACT" checkout --detach FETCH_HEAD
          test "$(git -C "$EXACT" rev-parse HEAD)" = "$EXACT_REF"
          # Reuse Cargo fingerprints for identical SDK sources. App sources keep checkout times.
          when=$(TZ=UTC git -C "$EXACT" log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)
          git -C "$EXACT" ls-files -z | (cd "$EXACT" && xargs -0 touch -h -d "$when")

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Restore Exact build cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: &exact-cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/hermes-lean-sys
            ~/.cargo/bin/wasm-bindgen
            ~/.cache/exact/binaryen
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.BUILD_ROOT }}/exact-sdk/target
            ${{ env.BUILD_ROOT }}/exact-sdk/vendor/ibex/crates/hermes-lean-sys-installer/target
            ${{ env.BUILD_ROOT }}/apps/apps/target
          key: exact-v2-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.EXACT_REF }}-${{ github.sha }}
          restore-keys: |
            exact-v2-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.EXACT_REF }}-

      - name: Restore published seed
        if: steps.cache.outputs.cache-matched-key == '' && !inputs.seed && contains(fromJSON('["web", "android", "ios"]'), matrix.platform)
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/portable-seed.sh restore

      - name: Prepare toolchain
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/prepare-exact-ci.sh "$PLATFORM"

      - name: Build app
        env:
          PLATFORM: ${{ matrix.platform }}
        working-directory: ${{ env.BUILD_ROOT }}/apps/apps
        run: |
          case "$PLATFORM" in
            web) args=(web-build --out dist) ;;
            android) args=(android --release --no-install) ;;
            linux) args=(linux) ;;
            ios) args=(ios --device --unsigned --release) ;;
            macos) args=(mac --no-install) ;;
            windows) args=(windows --out dist-windows) ;;
          esac
          start=$SECONDS
          bun exact.mjs "${args[@]}" --json | tee "$RUNNER_TEMP/exact-build.json"
          printf 'Build command took %ss\n' "$((SECONDS - start))"
          printf '| Platform | Exact cache hit | Build command |\n| --- | --- | ---: |\n| %s | %s | %ss |\n' \
            "$PLATFORM" "${{ steps.cache.outputs.cache-hit || 'false' }}" "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify build output exists
        env:
          BUILD_JSON: ${{ runner.temp }}/exact-build.json
        run: |
          bun --eval '
            import { stat } from "node:fs/promises";
            const output = JSON.parse(await Bun.file(process.env.BUILD_JSON).text()).path;
            if (typeof output !== "string" || !output) throw Error("Exact returned no artifact path");
            const info = await stat(output);
            if (info.isFile() && info.size === 0) throw Error("Exact produced an empty artifact");
          '

      - name: Publish seed
        if: inputs.seed && contains(fromJSON('["web", "android", "ios"]'), matrix.platform)
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/portable-seed.sh publish

      - name: Publish app output
        if: github.event_name == 'push' && github.repository != 'disposabl-dev/disposabl-exact' && contains(fromJSON('["web", "android", "ios"]'), matrix.platform)
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_JSON: ${{ runner.temp }}/exact-build.json
        run: bash scripts/publish-output.sh

      - name: Save rolling cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: *exact-cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
