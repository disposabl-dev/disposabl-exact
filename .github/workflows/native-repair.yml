name: Repair native base
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full current main commit SHA
        required: true
        type: string
      platform:
        description: Platform to rebuild
        required: true
        type: choice
        options: [android, ios]
permissions:
  contents: write
  actions: write
concurrency:
  group: exact-native-repair-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.platform == 'ios' && 'xcode-27' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      EXACT_REF: f40a26b9d7c07b5a38de9ded2e5a82c65d920ab0
      SEED_TAG: exact-seed-v1-f40a26b9
      EXACT_FEEDBACK: '0'
      PLATFORM: ${{ inputs.platform }}
      SOURCE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate target
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLATFORM" == android || "$PLATFORM" == ios ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$SOURCE_SHA" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Prepare SDK and app
        run: |
          echo "BUILD_ROOT=$RUNNER_TEMP/exact-work" >> "$GITHUB_ENV"
          echo "EXACT=$RUNNER_TEMP/exact-work/exact-sdk" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/exact-work"
          cp -R apps "$RUNNER_TEMP/exact-work/"
          git init "$RUNNER_TEMP/exact-work/exact-sdk"
          git -C "$RUNNER_TEMP/exact-work/exact-sdk" fetch --depth 1 https://github.com/expo/exact.git "$EXACT_REF"
          git -C "$RUNNER_TEMP/exact-work/exact-sdk" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/exact-work/exact-sdk" rev-parse HEAD)" = "$EXACT_REF"
          when=$(TZ=UTC git -C "$RUNNER_TEMP/exact-work/exact-sdk" log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)
          git -C "$RUNNER_TEMP/exact-work/exact-sdk" ls-files -z | (cd "$RUNNER_TEMP/exact-work/exact-sdk" && xargs -0 touch -h -d "$when")
      - name: Select Xcode
        if: inputs.platform == 'ios'
        run: |
          test -d /Applications/Xcode_27.2.app/Contents/Developer
          echo DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/hermes-lean-sys
            ~/.cargo/bin/wasm-bindgen
            ~/.cache/exact/binaryen
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.BUILD_ROOT }}/exact-sdk/target
            ${{ env.BUILD_ROOT }}/exact-sdk/vendor/ibex/crates/hermes-lean-sys-installer/target
            ${{ env.BUILD_ROOT }}/apps/apps/target
          key: exact-v2-${{ runner.os == 'macOS' && 'xcode-27' || 'ubuntu-24.04' }}-${{ runner.arch }}-${{ inputs.platform }}-${{ env.EXACT_REF }}-${{ inputs.sha }}
          restore-keys: exact-v2-${{ runner.os == 'macOS' && 'xcode-27' || 'ubuntu-24.04' }}-${{ runner.arch }}-${{ inputs.platform }}-${{ env.EXACT_REF }}-
      - name: Restore published seed
        if: steps.cache.outputs.cache-matched-key == ''
        run: bash scripts/portable-seed.sh restore
      - name: Prepare toolchain
        run: bash scripts/prepare-exact-ci.sh "$PLATFORM"
      - name: Build production base
        working-directory: ${{ env.BUILD_ROOT }}/apps/apps
        run: |
          export EXACT_UPDATE_TRUST=production EXACT_UPDATE_GENESIS=1 EXACT_BAKE_OUTPUT="$RUNNER_TEMP/ota-base"
          if [[ "$PLATFORM" == android ]]; then args=(android --release --no-install); else args=(ios --device --unsigned --release); fi
          bun exact.mjs "${args[@]}" --json > "$RUNNER_TEMP/exact-build.json"
      - name: Publish and notify updater
        env:
          BUILD_JSON: ${{ runner.temp }}/exact-build.json
        run: |
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$SOURCE_SHA" ]] || { echo 'Main advanced; refusing stale repair' >&2; exit 1; }
          test -d "$RUNNER_TEMP/ota-base" || { echo "Production receipt directory missing" >&2; exit 1; }
          export RELEASE_TAG="repair-$SOURCE_SHA-$PLATFORM-$GITHUB_RUN_ID"
          gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Native repair $PLATFORM ${SOURCE_SHA:0:8}" --notes 'Production base and compatibility receipt' --prerelease
          bash scripts/publish-output.sh
          gh workflow run updates.yml -R "$GITHUB_REPOSITORY" --ref main -f "base_sha=$SOURCE_SHA" -f "repair_platform=$PLATFORM" -f "repair_tag=$RELEASE_TAG"
