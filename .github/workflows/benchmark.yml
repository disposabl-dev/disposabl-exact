name: Benchmark hosted Ubuntu native builds

on:
  push:
    branches: ['ci/hosted-ubuntu-mobile-compare*']

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.app }} / ${{ matrix.target }}
    runs-on: ${{ contains(github.ref_name, '-boat') && 'boat-large' || contains(github.ref_name, '-github') && 'ubuntu-26.04' || 'blacksmith-8vcpu-ubuntu-2604' }}
    container: ${{ contains(github.ref_name, '-boat') && 'ubuntu:26.04@sha256:0d5255be560e2d2ddcfbfda88549e9e815ef29e7cd7fc62183d5709e6e2963c6' || '' }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(endsWith(github.ref_name, '-suite') && '["paperstack","trail","field","aperture","voice","template"]' || contains(github.ref_name, '-full-catalog-voice-') && '["voice"]' || (contains(github.ref_name, '-together') || contains(github.ref_name, '-split') || contains(github.ref_name, '-macos') || contains(github.ref_name, '-ios-cache')) && '["paperstack"]' || '["paperstack","trail","field","aperture","voice"]') }}
        target: ${{ fromJSON(contains(github.ref_name, '-together') && '["both"]' || contains(github.ref_name, '-split') && '["android","ios"]' || contains(github.ref_name, '-macos') && '["macos"]' || '["ios"]') }}
    env:
      SDK_RELAY: https://box-node-ac8946db2e01068c-8765.on.boat.dev
      BENCHMARK_APP: ${{ matrix.app }}
      BENCHMARK_TARGET: ${{ matrix.target }}
      EXACT_TOOLS_ORIGIN: none
      EXACT_FAST_UBUNTU_MIRROR: ${{ !contains(github.ref_name, '-boat') && !contains(github.ref_name, '-github') && '1' || '' }}
      EXACT_IOS_CACHE_PROBE: ${{ contains(github.ref_name, '-ios-cache') }}
      EXACT_IOS_PRIME_PUBLIC_CAPABILITIES: ${{ contains(github.ref_name, '-full-catalog-') }}
      EXACT_IOS_SWIFT_CACHE: ${{ contains(github.ref_name, '-swift-cas-') }}
      EXACT_IOS_FAST_PREVIEW: ${{ contains(github.ref_name, '-ios-cache-') }}
      EXACT_IOS_CACHE_MODE: >-
        ${{ endsWith(github.ref_name, '-ios-cache-publish') && 'pack' ||
            (endsWith(github.ref_name, '-ios-cache-restore') || endsWith(github.ref_name, '-suite') ||
            contains(github.ref_name, '-ios-cache-sticky-')) && 'restore' || '' }}
      EXACT_IOS_COMPILER_DISK_MODE: >-
        ${{ endsWith(github.ref_name, '-ios-cache-sticky-seed') && 'seed' ||
            contains(github.ref_name, '-ios-cache-sticky-') && 'read' || '' }}
      EXACT_IOS_PIPELINED_CACHE: ${{ contains(github.ref_name, '-ios-cache-sticky-pipelined') }}
      EXACT_IOS_PARALLEL_SETUP: ${{ endsWith(github.ref_name, '-ios-cache-sticky-parallel') || contains(github.ref_name, '-ios-cache-sticky-pipelined') }}
      CONVEX_ORIGIN: ws://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
    steps:
      - name: Prepare checkout and job timer
        run: |
          if ! command -v git >/dev/null || ! command -v openssl >/dev/null || ! command -v python3 >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates git openssl python3
          fi
          if [[ "${{ contains(github.ref_name, '-boat') }}" == true ]]; then
            mkdir -p /home/runner
            echo 'HOME=/home/runner' >> "$GITHUB_ENV"
            export HOME=/home/runner
          fi
          echo "TIMING_START=$(date +%s)" >> "$GITHUB_ENV"
          if [[ -n "${EXACT_IOS_CACHE_MODE:-}" ]]; then
            echo "EXACT_IOS_COMPILER_DIR=$HOME/.cache/exact-native/ios-linux" >> "$GITHUB_ENV"
          fi
      - name: Request SDK for this job
        if: matrix.target != 'android'
        run: |
          umask 077
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/sdk-recipient.key"
          openssl pkey -in "$RUNNER_TEMP/sdk-recipient.key" -pubout -out "$RUNNER_TEMP/sdk-recipient.pem"
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.target != 'android'
        with:
          name: sdk-recipient-${{ github.run_attempt }}-${{ matrix.app }}
          path: ${{ runner.temp }}/sdk-recipient.pem
          if-no-files-found: error
          retention-days: 1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: fixture
        name: Identify the pinned fixture
        run: |
          python3 - <<'FIXTURE'
          import json, os
          with open(".github/scripts/hosted-mobile/fixtures.json") as file:
              fixture = json.load(file)[os.environ["BENCHMARK_APP"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"repo={fixture['repo']}", file=output)
              print(f"ref={fixture['ref']}", file=output)
          FIXTURE
      - uses: actions/checkout@v7.0.1
        with:
          repository: disposabl-dev/${{ steps.fixture.outputs.repo }}
          ref: ${{ steps.fixture.outputs.ref }}
          path: fixture
          persist-credentials: false
      - id: pin
        run: cat .github/actions/exact-setup/pin.env >> "$GITHUB_OUTPUT"
      - name: Mount Blacksmith iOS dependency cache
        if: env.EXACT_IOS_COMPILER_DISK_MODE != ''
        uses: useblacksmith/stickydisk@042b9308ad79836dd69e87754a9dfbe4aba60d21 # v1
        with:
          key: exact-ios-compiler-${{ env.EXACT_IOS_SWIFT_CACHE == 'true' && steps.pin.outputs.ios-cas-cache-digest || steps.pin.outputs.ios-cache-digest }}
          path: /tmp/exact-ios-compiler-disk
      - name: Restore Exact v11 inputs early
        if: env.EXACT_IOS_PARALLEL_SETUP == 'true'
        uses: ./.github/actions/exact-setup
        env:
          EXACT_APP_CHECKOUT: ${{ github.workspace }}/fixture
        with:
          platform: ${{ matrix.target == 'ios' && 'ios-linux' || matrix.target == 'macos' && 'web' || 'android' }}
          exact-ref: ${{ steps.pin.outputs.exact-ref }}
          bun-version: ${{ steps.pin.outputs.bun-version }}
          bundle-version: ${{ steps.pin.outputs.bundle-version }}
      - name: Install Linux compiler tools
        env:
          EXACT_IOS_CACHE_DIGEST: ${{ env.EXACT_IOS_SWIFT_CACHE == 'true' && steps.pin.outputs.ios-cas-cache-digest || steps.pin.outputs.ios-cache-digest }}
        run: |
          scripts=.github/scripts/hosted-mobile
          if [[ "$BENCHMARK_TARGET:$EXACT_IOS_CACHE_MODE" == ios:restore ]] && command -v zstd >/dev/null; then
            (
              bash "$scripts/install-sdk.sh" fetch
              if [[ "$EXACT_IOS_PIPELINED_CACHE" == true ]]; then
                bash "$scripts/ios-compiler-cache.sh" stage "$RUNNER_TEMP/portable-ios-cache"
              fi
            ) & sdk=$!
            bash "$scripts/toolchain.sh" & tools=$!
            pids=("$sdk" "$tools")
            if [[ "$EXACT_IOS_PARALLEL_SETUP" == true ]]; then
              bash "$scripts/prepare-apple-exact.sh" ios bootstrap & pids+=("$!")
            fi
            status=0
            for pid in "${pids[@]}"; do wait "$pid" || status=$?; done
            exit "$status"
          fi
          bash "$scripts/toolchain.sh"
      - name: Install xTool SDK
        if: matrix.target != 'android'
        run: |
          phase=all
          if [[ -d "$RUNNER_TEMP/sdk-private/darwin.xtoolsdk" ]]; then phase=install; fi
          bash .github/scripts/hosted-mobile/install-sdk.sh "$phase"
      - name: Restore Exact v11 inputs
        if: env.EXACT_IOS_PARALLEL_SETUP != 'true'
        uses: ./.github/actions/exact-setup
        env:
          EXACT_APP_CHECKOUT: ${{ github.workspace }}/fixture
        with:
          platform: ${{ matrix.target == 'ios' && 'ios-linux' || matrix.target == 'macos' && 'web' || 'android' }}
          exact-ref: ${{ steps.pin.outputs.exact-ref }}
          bun-version: ${{ steps.pin.outputs.bun-version }}
          bundle-version: ${{ steps.pin.outputs.bundle-version }}
      - name: Verify the prepared Linux iOS SDK and Rust inputs
        if: env.EXACT_IOS_PARALLEL_SETUP == 'true'
        run: |
          bash .github/actions/exact-setup/scripts/setup-linux-ios.sh
          export PATH="$EXACT_APPLE_LLVM_BIN:$PATH"
          bash .github/scripts/hosted-mobile/prepare-apple-exact.sh ios check
      - name: Stabilize timestamps of the pinned Exact and Hermes inputs
        if: env.EXACT_IOS_CACHE_MODE != ''
        run: |
          git -C "$EXACT" ls-files -z | (cd "$EXACT" && xargs -0 touch -h -t 202001010000)
          find "$EXACT" -type d -not -path '*/.git*' -exec touch -h -t 202001010000 {} +
          hermes="${CARGO_HOME:-$HOME/.cargo}/hermes-lean-sys"
          if [[ -d "$hermes" ]]; then
            find "$hermes" -exec touch -h -t 202001010000 {} +
          fi
      - name: Compile shared iOS dependencies with the public seed app
        if: env.EXACT_IOS_CACHE_PROBE == 'true' && env.EXACT_IOS_CACHE_MODE != 'restore'
        run: bash .github/scripts/hosted-mobile/seed-ios-cache.sh
      - name: Pack the encrypted iOS compiler cache
        if: env.EXACT_IOS_CACHE_MODE == 'pack'
        run: bash .github/scripts/hosted-mobile/ios-compiler-cache.sh pack "$RUNNER_TEMP/portable-ios-cache"
      - uses: actions/upload-artifact@v7.0.2
        if: env.EXACT_IOS_CACHE_MODE == 'pack'
        with:
          name: portable-ios-compiler-cache
          path: ${{ runner.temp }}/portable-ios-cache
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Restore iOS compiler dependencies
        if: env.EXACT_IOS_CACHE_MODE == 'restore'
        env:
          EXACT_IOS_CACHE_DIGEST: ${{ env.EXACT_IOS_SWIFT_CACHE == 'true' && steps.pin.outputs.ios-cas-cache-digest || steps.pin.outputs.ios-cache-digest }}
        run: |
          mode=restore
          if [[ "$EXACT_IOS_PIPELINED_CACHE" == true ]]; then mode=activate; fi
          bash .github/scripts/hosted-mobile/ios-compiler-cache.sh "$mode" "$RUNNER_TEMP/portable-ios-cache"
      - name: Build and verify device IPA
        if: matrix.target == 'ios'
        working-directory: ${{ env.NATIVE_APP_DIR }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/hosted-mobile/build-ios.sh"
      - name: Build and verify Android APK
        if: matrix.target == 'android'
        working-directory: ${{ env.NATIVE_APP_DIR }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/hosted-mobile/build-android.sh"
      - name: Build both apps in parallel on this runner
        if: matrix.target == 'both'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/hosted-mobile/build-together.sh"
      - name: Build and verify macOS ZIP
        if: matrix.target == 'macos'
        working-directory: fixture/apps/apps
        run: bash "$GITHUB_WORKSPACE/.github/scripts/hosted-mobile/build-macos.sh"
      - name: Record wall time
        run: printf 'Verified native artifacts at %ss from preparation start\n' "$(( $(date +%s) - TIMING_START ))"
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.target == 'ios' || matrix.target == 'both'
        with:
          name: ${{ matrix.app }}-unsigned-iphone
          path: ${{ runner.temp }}/verified-ios/apps.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.target == 'android' || matrix.target == 'both'
        with:
          name: ${{ matrix.app }}-signed-android
          path: ${{ runner.temp }}/verified-android/app.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.target == 'macos'
        with:
          name: ${{ matrix.app }}-macos
          path: ${{ runner.temp }}/verified-macos/app.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Share the macOS ZIP through AppDrop
        if: matrix.target == 'macos' && endsWith(github.ref_name, '-appdrop')
        run: bash .github/scripts/hosted-mobile/share-macos.sh
      - name: Remove compiler cache passphrase
        if: always() && env.EXACT_IOS_CACHE_MODE != ''
        run: rm -f "$RUNNER_TEMP/ios-cache-passphrase"
