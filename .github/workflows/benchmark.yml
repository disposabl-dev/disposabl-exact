name: Benchmark hosted Ubuntu iOS

on:
  push:
    branches: [ci/hosted-ubuntu-mobile, ci/hosted-ubuntu-mobile-github, ci/hosted-ubuntu-mobile-boat]

permissions:
  contents: read

jobs:
  ios:
    name: ${{ matrix.app.name }} / Ubuntu iOS
    runs-on: ${{ github.ref_name == 'ci/hosted-ubuntu-mobile-boat' && 'boat-large' || github.ref_name == 'ci/hosted-ubuntu-mobile-github' && 'ubuntu-26.04' || 'blacksmith-8vcpu-ubuntu-2604' }}
    container: ${{ github.ref_name == 'ci/hosted-ubuntu-mobile-boat' && 'ubuntu:26.04@sha256:0d5255be560e2d2ddcfbfda88549e9e815ef29e7cd7fc62183d5709e6e2963c6' || '' }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        app:
          - {name: Paperstack, slug: paperstack, repo: exact-first-paperstack-hosts, ref: 76ad1acc932a31d7bc731b35dde47ab75e778ad8}
    env:
      SDK_RELAY: https://box-node-ac8946db2e01068c-8765.on.boat.dev
      BENCHMARK_APP: ${{ matrix.app.slug }}
      EXACT_TOOLS_ORIGIN: none
      CONVEX_ORIGIN: ws://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
    steps:
      - name: Request SDK for this job
        run: |
          umask 077
          if ! command -v openssl >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends openssl ca-certificates
          fi
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/sdk-recipient.key"
          openssl pkey -in "$RUNNER_TEMP/sdk-recipient.key" -pubout -out "$RUNNER_TEMP/sdk-recipient.pem"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-recipient-${{ github.run_attempt }}-${{ matrix.app.slug }}
          path: ${{ runner.temp }}/sdk-recipient.pem
          if-no-files-found: error
          retention-days: 1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: disposabl-dev/${{ matrix.app.repo }}
          ref: ${{ matrix.app.ref }}
          path: fixture
          persist-credentials: false
      - name: Install Linux compiler tools
        run: bash .github/scripts/hosted-mobile/toolchain.sh
      - name: Install xTool SDK
        run: bash .github/scripts/hosted-mobile/install-sdk.sh
      - id: pin
        run: cat .github/actions/exact-setup/pin.env >> "$GITHUB_OUTPUT"
      - name: Restore Exact v11 inputs
        uses: ./.github/actions/exact-setup
        env:
          EXACT_APP_CHECKOUT: ${{ github.workspace }}/fixture
        with:
          platform: ios-linux
          exact-ref: ${{ steps.pin.outputs.exact-ref }}
          bun-version: ${{ steps.pin.outputs.bun-version }}
          bundle-version: ${{ steps.pin.outputs.bundle-version }}
      - name: Build and verify device IPA
        working-directory: ${{ env.NATIVE_APP_DIR }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/hosted-mobile/build-ios.sh"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.app.slug }}-unsigned-iphone
          path: ${{ runner.temp }}/verified-ios/apps.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
