name: Benchmark Exact builds

on:
  push:
    branches: [ci/exact-ubuntu-benchmark, ci/exact-ubuntu-web-verify, ci/exact-ubuntu-android-verify, ci/exact-boat-benchmark]
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [ubuntu-26.04, blacksmith-8vcpu-ubuntu-2604, boat-large]
        default: ubuntu-26.04
      ios:
        description: Build iOS only, on a runner with the xTool SDK and compiler tools
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tools:
    name: Wait for the pinned Exact caches
    runs-on: ubuntu-26.04
    timeout-minutes: 145
    outputs:
      exact-ref: ${{ steps.pin.outputs.exact-ref }}
      bun-version: ${{ steps.pin.outputs.bun-version }}
      bundle-version: ${{ steps.pin.outputs.bundle-version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: cat .github/actions/exact-setup/pin.env >> "$GITHUB_OUTPUT"
      - name: Verify cache publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_REF: ${{ steps.pin.outputs.exact-ref }}
          BUN_VERSION: ${{ steps.pin.outputs.bun-version }}
          BUNDLE_VERSION: ${{ steps.pin.outputs.bundle-version }}
        run: |
          python3 .github/actions/exact-setup/scripts/release-manifest.py \
            "$BUNDLE_VERSION" "$EXACT_REF" "$BUN_VERSION" "$RUNNER_TEMP/exact-inputs.json" \
            --wait 8400 --producer-sha 82a8a19b779bc6f60012f3994981520707c5523f

  build:
    name: ${{ matrix.app.name }} / ${{ matrix.platform }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner == 'boat-large' && (vars.EXACT_BOAT_RUNNER || 'boat-large') || matrix.runner }}
    timeout-minutes: 30
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner && format('["{0}"]', inputs.runner) || github.ref_name == 'ci/exact-boat-benchmark' && '["boat-large"]' || '["blacksmith-8vcpu-ubuntu-2604"]') }}
        platform: ${{ fromJSON(inputs.ios && '["ios-linux"]' || github.ref_name == 'ci/exact-ubuntu-web-verify' && '["web"]' || github.ref_name == 'ci/exact-ubuntu-android-verify' && '["android"]' || '["web","android"]') }}
        app:
          - {name: Field Journal, repo: exact-first-field-hosts, ref: 2a56824c219177e00732d58b2d59154f46165792}
          - {name: Aperture Log, repo: exact-first-aperture-hosts, ref: d742d4f40a281ec7a4443a78d0df48e77215de70}
          - {name: Voice Notes, repo: exact-first-voice-hosts-clean, ref: 629db1d7046f8f2c52d87477229ab6cb36637447}
    env:
      EXACT_TOOLS_ORIGIN: none
      CONVEX_ORIGIN: ws://127.0.0.1:3210
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: disposabl-dev/${{ matrix.app.repo }}
          ref: ${{ matrix.app.ref }}
          path: fixture
          persist-credentials: false
      - name: Set up Exact
        uses: ./.github/actions/exact-setup
        env:
          EXACT_APP_CHECKOUT: ${{ github.workspace }}/fixture
          EXACT_APPLE_SDK: ${{ vars.EXACT_APPLE_SDK }}
          EXACT_APPLE_LLVM_BIN: ${{ vars.EXACT_APPLE_LLVM_BIN }}
          EXACT_XCODE_XIP: ${{ vars.EXACT_XCODE_XIP }}
        with:
          platform: ${{ matrix.platform }}
          exact-ref: ${{ needs.tools.outputs.exact-ref }}
          bun-version: ${{ needs.tools.outputs.bun-version }}
          bundle-version: ${{ needs.tools.outputs.bundle-version }}
      - name: Install web dependencies
        if: matrix.platform == 'web'
        working-directory: fixture/apps/apps
        run: |
          mkdir -p .exact
          ln -s "$EXACT" .exact/checkout
          bun install --frozen-lockfile
      - name: Build web
        if: matrix.platform == 'web'
        working-directory: fixture/apps/apps
        run: |
          bun exact.mjs web-build --out dist
          test -s dist/index.html
      - name: Run feature smoke test
        if: matrix.platform == 'web'
        working-directory: fixture/apps/apps
        run: bash "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/test-web.sh"
      - name: Prepare APK signing
        if: matrix.platform == 'android'
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/benchmark.p12" \
            -storepass benchmark -keypass benchmark -alias benchmark -keyalg RSA -keysize 2048 \
            -validity 7 -dname 'CN=Exact benchmark'
      - name: Build signed APK
        if: matrix.platform == 'android'
        working-directory: ${{ env.NATIVE_APP_DIR }}
        env:
          EXACT_KEYSTORE: ${{ runner.temp }}/benchmark.p12
          EXACT_KEY_ALIAS: benchmark
          EXACT_KEYSTORE_PASSWORD: benchmark
          EXACT_KEY_PASSWORD: benchmark
          EXACT_ANDROID_APK_ONLY: '1'
        run: |
          bun exact.mjs android --release --no-install --json > "$RUNNER_TEMP/build.json"
          apk=$(jq -er .path "$RUNNER_TEMP/build.json")
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" verify "$apk"
      - name: Build unsigned device IPA
        if: matrix.platform == 'ios-linux'
        working-directory: ${{ env.NATIVE_APP_DIR }}
        run: |
          bun exact.mjs ios --device --release --unsigned --archive "$RUNNER_TEMP/apps.ipa"
          unzip -tq "$RUNNER_TEMP/apps.ipa"
      - name: Upload unsigned device IPA
        if: matrix.platform == 'ios-linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.app.name }}-${{ matrix.runner }}-ipa
          path: ${{ runner.temp }}/apps.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
