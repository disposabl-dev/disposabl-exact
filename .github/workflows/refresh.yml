name: Refresh shared Exact cache
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh.yml', '.github/ci/**']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: Qualify a single platform (default runs all four)
        type: choice
        options: [all, web, android, ios, macos]
permissions: { contents: read }
concurrency: { group: 'exact-refresh-${{ github.ref }}', cancel-in-progress: false }
jobs:
  resolve:
    if: github.repository == 'disposabl-dev/disposabl-exact'
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      platforms: ${{ steps.version.outputs.platforms }}
    steps:
      - id: version
        env: { REQUESTED: '${{ inputs.platform }}' }
        run: |
          ref=$(git ls-remote https://github.com/expo/exact.git refs/heads/main | cut -f1)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          case "$REQUESTED" in
            ""|all) platforms='["android","ios","macos","web"]' ;;
            ios) platforms='["ios","web"]' ;; # iOS uses the verified web archive's host baker.
            *) platforms=$(jq -cn --arg p "$REQUESTED" '[$p]') ;;
          esac
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy: &matrix
      fail-fast: false
      matrix: { platform: '${{ fromJSON(needs.resolve.outputs.platforms) }}' }
    env: &inputs { EXACT_REF: '${{ needs.resolve.outputs.ref }}', PLATFORM: '${{ matrix.platform }}' }
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - &bun
        uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - run: bash .github/ci/cache-build.sh "$PLATFORM"
      - uses: actions/upload-artifact@v7.0.2
        with: { name: 'cache-${{ matrix.platform }}', path: '${{ runner.temp }}/cache-output/', if-no-files-found: error, retention-days: 1, compression-level: 0 }
  verify:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy: *matrix
    env: *inputs
    steps:
      - *checkout
      - *bun
      - uses: actions/download-artifact@v8.0.2
        with: { name: 'cache-${{ matrix.platform }}', path: '${{ runner.temp }}/restored-cache' }
      - if: matrix.platform == 'ios'
        uses: actions/download-artifact@v8.0.2
        with: { name: cache-web, path: '${{ runner.temp }}/restored-cache' }
      - env: { CACHE_VERIFY: '1' }
        run: bash .github/ci/cache-build.sh "$PLATFORM"
  boat:
    needs: resolve
    if: github.ref == 'refs/heads/main' && (!inputs.platform || inputs.platform == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - run: |
          curl -fsSL --retry 3 'https://boat.dev/api/boat/cli/download?platform=linux-x64&channel=prod' -o "$RUNNER_TEMP/boat"
          chmod +x "$RUNNER_TEMP/boat"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - env: { BOAT_API_KEY: '${{ secrets.BOAT_API_KEY }}', EXACT_REF: '${{ needs.resolve.outputs.ref }}', BUN_VERSION: '1.4.5' }
        run: bash .github/ci/boat.sh

  publish:
    needs: [resolve, verify]
    if: github.ref == 'refs/heads/main' && (!inputs.platform || inputs.platform == 'all')
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', EXACT_REF: '${{ needs.resolve.outputs.ref }}' }
    steps:
      - uses: actions/checkout@v7.0.1
        with: { sparse-checkout: .github/ci, persist-credentials: false }
      - uses: actions/download-artifact@v8.0.2
        with: { pattern: cache-*, merge-multiple: true, path: cache }
      - run: |
          for platform in web android ios macos; do test -s "cache/cache-$platform.tar.zst.part-aaa"; done
          for platform in web android ios macos; do
            tag="exact-ci-linux-v3-$platform-$EXACT_REF-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            gh release create "$tag" --target "$GITHUB_SHA" --title "Exact $platform cache $EXACT_REF" --notes 'Verified on a fresh Ubuntu runner.' --latest=false cache/cache-"$platform".tar.zst.part-*
          done
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq -f .github/ci/cache-sets.jq "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/sets.json"
          jq -e --argjson run "$GITHUB_RUN_ID" 'any(.[]; .run == $run)' "$RUNNER_TEMP/sets.json" >/dev/null
          jq -r --slurpfile sets "$RUNNER_TEMP/sets.json" '
            ($sets[0][:2] | map(.tags[]) ) as $keep | .[][] | select(.draft == false) | .tag_name
            | select(test("^exact-ci-linux-" + (if ($sets[0]|length) >= 2 then "v[23]" else "v3" end) + "-(android|ios|macos|web)-[a-f0-9]{40}-[0-9]+-[0-9]+$")) | select(. as $t | $keep | index($t) == null)
          ' "$RUNNER_TEMP/releases.json" | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
