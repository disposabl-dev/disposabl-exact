name: Trace Android cross-app recompilation with R8
on: workflow_dispatch
permissions: { contents: read, actions: read }
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CACHE_VERIFY: '1'
      EXACT_REF: 39c69d97d08f7ff4d14a41e26c96f5b1ae6216c4
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 46038819874
          name: cache-android
          path: ${{ runner.temp }}/restored-cache
      - name: Record Cargo rebuild reasons
        run: |
          mkdir "$RUNNER_TEMP/probe"
          cat > "$RUNNER_TEMP/probe/cargo" <<'SH'
          #!/usr/bin/env bash
          set -u
          original=("$@")
          args=()
          build=false
          json=false
          for arg in "$@"; do
            case "$arg" in
              --) args+=("$@"); break ;;
              build|rustc) args+=("$arg" -vv); build=true ;;
              --message-format=json*) args+=("$arg"); json=true ;;
              -q|--quiet) ;;
              *) args+=("$arg") ;;
            esac
            shift
          done
          if ! "$build"; then exec "$HOME/.cargo/bin/cargo" "${original[@]}"; fi
          log=$(mktemp "$RUNNER_TEMP/dirty.XXXXXX")
          if "$json"; then
            "$HOME/.cargo/bin/cargo" "${args[@]}" 2>"$log" | awk '/^\{/'
            status=${PIPESTATUS[0]}
          else
            "$HOME/.cargo/bin/cargo" "${args[@]}" 2>"$log"
            status=$?
          fi
          grep -E '^ *(Dirty |Compiling |Finished |error)' "$log" >&2 || :
          exit "$status"
          SH
          chmod +x "$RUNNER_TEMP/probe/cargo"
          export PATH="$RUNNER_TEMP/probe:$PATH"
          bash .github/ci/cache-build.sh android
      - if: always()
        run: grep -hE '^ *Dirty (wgpu|exact-logic|vello|apps-android)' "$RUNNER_TEMP"/dirty.* || true
