name: Measure iOS restore and setup
on: workflow_dispatch
permissions: { contents: read, actions: read }
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXACT_REF: 39c69d97d08f7ff4d14a41e26c96f5b1ae6216c4
      CACHE_VERIFY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 46040506760
          name: cache-ios
          path: ${{ runner.temp }}/restored-cache
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 46038819874
          name: cache-web
          path: ${{ runner.temp }}/ota-cache
      - env: { EXACT_OTA_TOOLS_READY: '1' }
        run: |
          cat "$RUNNER_TEMP"/ota-cache/cache-web.tar.zst.part-* | zstd -dc | tar -xf - -C "$HOME" ".cache/exact/ota-tools/$EXACT_REF/exact-js-bake"
          test -x "$HOME/.cache/exact/ota-tools/$EXACT_REF/exact-js-bake"
          bash .github/ci/cache-build.sh ios
