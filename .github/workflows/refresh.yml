name: Compare Android Gradle startup with R8
on: workflow_dispatch
permissions: { contents: read, actions: read }
jobs:
  restore:
    strategy:
      fail-fast: false
      matrix:
        gradle: [stock, daemon]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CACHE_VERIFY: '1'
      EXACT_REF: 39c69d97d08f7ff4d14a41e26c96f5b1ae6216c4
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 46038819874
          name: cache-android
          path: ${{ runner.temp }}/restored-cache
      - if: matrix.gradle == 'daemon'
        run: |
          cat >> .github/ci/checkout.sh <<'SH'
          python3 - "$exact/scripts/agent-android.mjs" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          stock = "env.CI || graph.env.GRADLE_USER_HOME ? ['--no-daemon'] : []"
          assert source.count(stock) == 1
          path.write_text(source.replace(stock, "env.CI || graph.env.GRADLE_USER_HOME ? ['--daemon'] : []"))
          PY
          SH
      - run: bash .github/ci/cache-build.sh android
