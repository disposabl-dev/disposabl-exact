name: Measure iOS restore and setup
on: workflow_dispatch
permissions: { contents: read, actions: read }
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXACT_REF: 39c69d97d08f7ff4d14a41e26c96f5b1ae6216c4
      CACHE_VERIFY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 46040506760
          name: cache-ios
          path: ${{ runner.temp }}/restored-cache
      - name: Capture Cargo's reasons for rebuilding on a fresh runner
        run: |
          mkdir "$RUNNER_TEMP/probe"
          cat > "$RUNNER_TEMP/probe/cargo" <<'SH'
          #!/usr/bin/env bash
          set -u
          for arg in "$@"; do
            if [[ "$arg" == build || "$arg" == rustc ]]; then
              log=$(mktemp "$RUNNER_TEMP/cargo-reasons.XXXXXX")
              "$HOME/.cargo/bin/cargo" "$@" -vv 2>"$log"
              result=$?
              grep -E '^ *(Dirty |Compiling |Finished |error)' "$log" >&2 || :
              exit "$result"
            fi
          done
          exec "$HOME/.cargo/bin/cargo" "$@"
          SH
          chmod +x "$RUNNER_TEMP/probe/cargo"
          export PATH="$RUNNER_TEMP/probe:$PATH"
          bash .github/ci/cache-build.sh ios
      - if: always()
        run: grep -hE '^ *Dirty (libsqlite3-sys|exact-logic|apps-apple|exact-js)' "$RUNNER_TEMP"/cargo-reasons.* || true
