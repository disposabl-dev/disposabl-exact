name: Refresh shared Exact cache
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh.yml', '.github/workflows/cache-platform.yml', '.github/ci/**']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: Qualify a single platform (default runs all four)
        type: choice
        options: [all, web, android, ios, macos]
permissions: { contents: read }
concurrency: { group: 'exact-refresh-${{ github.ref }}', cancel-in-progress: false }
jobs:
  resolve:
    if: github.repository == 'disposabl-dev/disposabl-exact'
    runs-on: ubuntu-24.04
    outputs: { ref: '${{ steps.version.outputs.ref }}' }
    steps:
      - id: version
        run: |
          ref=$(git ls-remote https://github.com/expo/exact.git refs/heads/main | cut -f1)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] && echo "ref=$ref" >> "$GITHUB_OUTPUT"
  cache:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["web","android","ios","macos"]') }}
    uses: ./.github/workflows/cache-platform.yml
    with:
      platform: ${{ matrix.platform }}
      exact: ${{ needs.resolve.outputs.ref }}
  boat:
    needs: resolve
    if: github.ref == 'refs/heads/main' && (!inputs.platform || inputs.platform == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - run: |
          curl -fsSL --retry 3 'https://boat.dev/api/boat/cli/download?platform=linux-x64&channel=prod' -o "$RUNNER_TEMP/boat"
          chmod +x "$RUNNER_TEMP/boat"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - env: { BOAT_API_KEY: '${{ secrets.BOAT_API_KEY }}', EXACT_REF: '${{ needs.resolve.outputs.ref }}', BUN_VERSION: '1.4.5' }
        run: bash .github/ci/boat.sh

  publish:
    needs: [resolve, cache]
    if: github.ref == 'refs/heads/main' && (!inputs.platform || inputs.platform == 'all')
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', EXACT_REF: '${{ needs.resolve.outputs.ref }}' }
    steps:
      - uses: actions/download-artifact@v8.0.2
        with: { pattern: cache-*, merge-multiple: true, path: cache }
      - run: |
          for platform in web android ios macos; do test -s "cache/cache-$platform.tar.zst.part-aaa"; done
          tag="exact-ci-linux-v3-$EXACT_REF-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Exact $EXACT_REF" --notes 'Verified on fresh Ubuntu runners for all four platforms.' --latest=false cache/*
          gh release list --limit 100 --exclude-drafts --json tagName --jq '[.[].tagName | select(startswith("exact-ci-linux-v3-"))] | sort_by(split("-")[-2:] | map(tonumber)) | reverse | .[2:][]' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
