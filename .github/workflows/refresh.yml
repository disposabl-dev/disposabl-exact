name: Measure verified iOS release cache downloads
on: workflow_dispatch
permissions: { contents: read }
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix: { first: [gh, aria] }
    env:
      FIRST: ${{ matrix.first }}
      GH_TOKEN: ${{ github.token }}
      TAG: exact-ci-linux-v2-ios-d236579d166c4b4eb9df3b6a055d63c4ee82cb58-46031837045-1
    steps:
      - run: |
          set -euo pipefail
          command -v aria2c
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[]|select(.name=="cache-ios.tar.zst.part-aaa")')
          name=$(jq -er .name <<< "$asset")
          digest=$(jq -er '.digest|ltrimstr("sha256:")' <<< "$asset")
          url=$(jq -er .browser_download_url <<< "$asset")
          order=(gh aria)
          if [[ "$FIRST" == aria ]]; then order=(aria gh); fi
          for method in "${order[@]}"; do
            dir=$(mktemp -d "$RUNNER_TEMP/$method.XXXXXX")
            start=$SECONDS
            if [[ "$method" == gh ]]; then
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "$name" --dir "$dir"
            else
              aria2c --quiet=true --file-allocation=none --split=4 --max-connection-per-server=4 --min-split-size=32M --dir="$dir" --out="$name" "$url"
            fi
            elapsed=$((SECONDS - start))
            (cd "$dir" && echo "$digest  $name" | sha256sum --check --strict)
            echo "Verified $method download in ${elapsed}s plus $((SECONDS - start - elapsed))s checksum"
            rm -r "$dir"
          done
