name: Build a first iOS app from the published Exact caches
on: workflow_dispatch
permissions: { contents: read }
jobs:
  ios:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env: { PLATFORM: ios, CACHE_VERIFY: '1' }
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - name: Resolve the production cache set
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -f .github/ci/cache-sets.jq |
            jq -er 'first // error("Missing four-platform cache set") | "EXACT_REF=\(.exact)\nEXACT_CACHE_TAGS=\(.tags|tojson)"' >> "$GITHUB_ENV"
      - name: Build and verify from public release archives
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash .github/ci/cache-build.sh ios
