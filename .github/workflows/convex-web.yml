name: Deploy web to Convex

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: convex-web-${{ github.event_name }}-${{ github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref != 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXACT: ${{ github.workspace }}/.exact-sdk
      EXACT_TOOLS_ORIGIN: none
      BUILD_WEB: >-
        cd ../../apps/apps &&
        rm -rf dist/convex &&
        env -u CONVEX_DEPLOY_KEY CONVEX_ORIGIN="wss://${VITE_CONVEX_URL#https://}" bun exact.mjs web-build --out dist/convex &&
        rm -f dist/convex/.exact-build.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: expo/exact
          ref: 28f071ca1b04fb4af90af965bab5241fa26d037a
          path: .exact-sdk
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Exact and install dependencies
        run: |
          (cd "$EXACT" && CHROME="$(command -v google-chrome)" bun scripts/exact.mjs setup --platform web)
          (cd packages/backend && bun install --frozen-lockfile)
          (cd apps/apps && mkdir -p .exact && ln -s "$EXACT" .exact/checkout && bun install --frozen-lockfile)

      - name: Deploy production
        if: github.event_name == 'push'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bun run static-hosting deploy --dist ../../apps/apps/dist/convex --build-command "$BUILD_WEB"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        working-directory: packages/backend
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: |
          # Static Hosting needs the credential for the branch deployment. Use the same claim endpoint as convex deploy.
          IFS=: read -r _ team project <<< "${CONVEX_DEPLOY_KEY%%|*}"
          CONVEX_DEPLOY_KEY=$(curl -fsS https://api.convex.dev/api/claim_preview_deployment \
            -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" \
            --json "$(jq -nc --arg branch "$GITHUB_HEAD_REF" --arg team "$team" --arg project "$project" \
              '{identifier:$branch,reuse:true,projectSelection:{kind:"teamAndProjectSlugs",teamSlug:$team,projectSlug:$project}}')" \
            | jq -er 'select(.deploymentName and .adminKey) | "preview:\(.deploymentName)|\(.adminKey | split("|")[-1])"')
          echo "::add-mask::$CONVEX_DEPLOY_KEY"
          bun run static-hosting deploy --dist ../../apps/apps/dist/convex --build-command "$BUILD_WEB"
