name: Exact app generator
on:
  pull_request:
    paths: ['packages/create-disposabl-app/**', '.github/**', 'packages/disposabl-kit/**']
  push:
    branches: [main]
concurrency:
  group: generator-${{ github.event_name == 'push' && 'publication' || github.ref }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  generator:
    if: github.repository == 'disposabl-dev/disposabl-exact'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - working-directory: packages/create-disposabl-app
        run: bun install --frozen-lockfile && bun run test
      - if: github.event_name != 'pull_request'
        working-directory: packages/create-disposabl-app
        run: |
          version="$(node -p 'require("./package.json").version')-next.${GITHUB_RUN_NUMBER}"
          npm pkg set "version=$version" "gitHead=$GITHUB_SHA"
          bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/generator.tgz"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with: { name: generator, path: '${{ runner.temp }}/generator.tgz', if-no-files-found: error, retention-days: 1 }
  publish:
    needs: generator
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/setup-node@v6
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org', package-manager-cache: false }
      - uses: actions/download-artifact@v8.0.2
        with: { name: generator }
      - run: |
          version=$(tar -xOf generator.tgz package/package.json | jq -r .version)
          registry=https://registry.npmjs.org/create-disposabl-app
          status=$(curl -sS --retry 3 -o published.json -w '%{http_code}' "$registry/$version")
          case "$status" in
            200) test "$(jq -r '.dist.integrity' published.json)" = "sha512-$(openssl dgst -sha512 -binary generator.tgz | openssl base64 -A)" ;;
            404) npm publish generator.tgz --tag next --access public ;;
            *) echo "npm registry returned HTTP $status" >&2; exit 1 ;;
          esac
