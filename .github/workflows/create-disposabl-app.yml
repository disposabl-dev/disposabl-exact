name: Exact app generator
on:
  pull_request:
    paths: ['packages/create-disposabl-app/**', '.github/**', 'packages/disposabl-kit/**', 'package.json', 'bun.lock', 'scripts/*.mjs', 'README.md']
  push:
    branches: [main]
concurrency:
  group: generator-${{ github.event_name == 'push' && 'publication' || github.ref }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  generator:
    # 251083309 is the immutable GitHub account ID for vivek-yast.
    if: github.repository == 'disposabl-dev/disposabl-exact' && (github.event_name != 'pull_request' || github.event.pull_request.user.id == 251083309)
    runs-on: ravion/ee=github-actions/type=sandbox/cpu=auto/memory=auto/disk=auto/disk_cache=auto/interruptible=true/id=${{ github.run_id }}-${{ github.run_attempt }}-create-disposabl-app-generator
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false, fetch-depth: 0, clean: false }
      - &node
        uses: actions/setup-node@v6
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org', package-manager-cache: false }
      - &bun
        uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - working-directory: packages/create-disposabl-app
        run: |
          node --test ../../.github/ci/updates.test.mjs
          bun install --frozen-lockfile && bun run test
  publish:
    needs: generator
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - *node
      - *bun
      - working-directory: packages/create-disposabl-app
        run: bun install --frozen-lockfile --ignore-scripts && bun run build
      - working-directory: packages/create-disposabl-app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_ignore_scripts: 'true'
        run: bun run semantic-release
