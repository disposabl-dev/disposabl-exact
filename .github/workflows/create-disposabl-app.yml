name: Exact app generator
on:
  pull_request:
    paths: ['packages/create-disposabl-app/**', '.github/**', 'packages/disposabl-kit/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator:
    if: github.repository == 'disposabl-dev/disposabl-exact'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - working-directory: packages/create-disposabl-app
        run: bun install --frozen-lockfile && bun run test
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: packages/create-disposabl-app
        run: bun pm pack --filename "$RUNNER_TEMP/generator.tgz" && npm publish "$RUNNER_TEMP/generator.tgz" --access public --tag next
