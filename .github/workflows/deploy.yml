name: Deploy app
on:
  workflow_call:
    secrets:
      CONVEX_DEPLOY_KEY: { required: false }
      CONVEX_DEPLOY_KEY_PREVIEW: { required: false }
  pull_request:
    paths-ignore: &generator-only ['packages/create-disposabl-app/**', '.github/workflows/create-disposabl-app.yml']
  push:
    branches: [main]
    paths-ignore: *generator-only
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  EXACT_FEEDBACK: '0'
  CI_SCRIPTS: ${{ github.repository == 'disposabl-dev/disposabl-exact' && '.github/ci' || '.disposabl-ci/.github/ci' }}
jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.platforms.outputs.web }}
      web-platforms: ${{ steps.platforms.outputs.web_platforms }}
      report: ${{ github.repository != 'disposabl-dev/disposabl-exact' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
      native: ${{ steps.platforms.outputs.native }}
      exact: ${{ steps.platforms.outputs.exact }}
      cache: ${{ steps.platforms.outputs.cache }}
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - &shared
        if: github.repository != 'disposabl-dev/disposabl-exact'
        uses: actions/checkout@v7.0.1
        with:
          repository: disposabl-dev/disposabl-exact
          ref: main
          path: .disposabl-ci
          sparse-checkout: .github/ci
          persist-credentials: false
      - &bun
        uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - id: platforms
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          repo=disposabl-dev/disposabl-exact
          gh api --paginate --slurp "repos/$repo/releases?per_page=100" | jq -f "$CI_SCRIPTS/cache-sets.jq" |
            jq -er 'first // error("No four-platform Exact cache has passed refresh") | "exact=\(.exact)\ncache=\(.tags|tojson)"' >> "$GITHUB_OUTPUT"
          bun -e '
            import { platform } from "./packages/disposabl-kit/server/platform.ts";
            const production = process.env.GITHUB_EVENT_NAME === "push";
            const web = platform.web || production ? ["web", "api", "mcp"].filter(name => platform[name]) : [];
            const native = [...platform.mobile, ...(platform.macos ? ["macos"] : [])];
            console.log(`web=${platform.web}\nweb_platforms=${JSON.stringify(web)}\nnative=${JSON.stringify(native)}`);
          ' >> "$GITHUB_OUTPUT"
  report-start:
    needs: config
    if: needs.config.outputs.report == 'true' && (needs.config.outputs.web-platforms != '[]' || (github.event_name == 'push' && needs.config.outputs.native != '[]'))
    runs-on: ubuntu-24.04
    permissions: { id-token: write }
    steps:
      - name: Report platforms building
        continue-on-error: true
        env:
          WEB_PLATFORMS: ${{ needs.config.outputs.web-platforms }}
          NATIVE_PLATFORMS: ${{ github.event_name == 'push' && needs.config.outputs.native || '[]' }}
        run: &report |
          set -euo pipefail
          endpoint=https://www.disposabl.dev/github/deployments
          token=$(curl --silent --show-error --fail --max-time 10 --get \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$endpoint" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er .value)
          printf '::add-mask::%s\n' "$token"
          send() {
            local payload
            payload=$(jq -cn --arg platform "$1" --arg status "$2" --arg url "${3:-}" \
              '{platform: $platform, status: $status} + (if $url == "" then {} else {url: $url} end)')
            curl --silent --show-error --fail --max-time 15 --retry 1 \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data "$payload" "$endpoint" >/dev/null
          }
          failed=0
          result() {
            local receipt="$RUNNER_TEMP/deployment-reports/report-$1.json"
            status=building url=
            [[ "${REPORT_FINISHED:-}" == true ]] || return 0
            status=error
            [[ -f "$receipt" ]] || return 0
            status=$(jq -er '.status | select(. == "done" or . == "error")' "$receipt") || return 1
            url=$(jq -er 'if .status == "done" then .url // "" else "" end' "$receipt")
          }
          for platform in $(jq -r '.[]' <<< "$WEB_PLATFORMS"); do
            case "$platform" in web|api|mcp) ;; *) failed=1; continue ;; esac
            result web || { failed=1; continue; }
            if [[ -n "$url" ]]; then
              case "$platform" in
                api) url="${url%/}/openapi.json" ;;
                mcp) url="${url%/}/mcp" ;;
              esac
            fi
            send "$platform" "$status" "$url" || failed=1
          done
          for platform in $(jq -r '.[]' <<< "$NATIVE_PLATFORMS"); do
            case "$platform" in android|ios|macos) ;; *) failed=1; continue ;; esac
            result "$platform" || { failed=1; continue; }
            send "$platform" "$status" "$url" || failed=1
          done
          if [[ "$failed" == 1 ]]; then
            echo '::warning::One or more platform statuses could not be sent to Disposabl.'
            exit 1
          fi
  web:
    needs: [config, report-start]
    if: ${{ !cancelled() && needs.config.result == 'success' && (github.event_name == 'push' || needs.config.outputs.web == 'true') }}
    env: { EXACT_CACHE_TAGS: '${{ needs.config.outputs.cache }}' }
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *shared
      - *bun
      - if: needs.config.outputs.web == 'true'
        env: { GH_TOKEN: '${{ github.token }}', EXACT_REF: '${{ needs.config.outputs.exact }}' }
        run: bash "$CI_SCRIPTS/setup.sh" web
      - id: deploy
        env:
          WEB: ${{ needs.config.outputs.web }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BUILD_ONLY: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
          CONVEX_DEPLOY_KEY: ${{ secrets[github.event_name == 'pull_request' && 'CONVEX_DEPLOY_KEY_PREVIEW' || 'CONVEX_DEPLOY_KEY'] }}
        run: bash "$CI_SCRIPTS/web.sh"

      - id: receipt
        if: ${{ always() && needs.config.outputs.report == 'true' && needs.config.outputs.web-platforms != '[]' }}
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ job.status }}
          PLATFORM: web
          WEB_URL: ${{ steps.deploy.outputs.url }}
        run: &receipt |
          set -euo pipefail
          status=error url=
          if [[ "$BUILD_RESULT" == success ]]; then
            status=done
            installer="$RUNNER_TEMP/installer-$PLATFORM.json"
            if [[ "$PLATFORM" == web ]]; then url=${WEB_URL:?Missing deployed web origin}
            elif [[ -f "$installer" ]]; then url=$(jq -er .url "$installer"); fi
          fi
          jq -cn --arg status "$status" --arg url "$url" '{status: $status, url: $url}' > "$RUNNER_TEMP/report-$PLATFORM.json"
      - if: ${{ always() && steps.receipt.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: exact-deployment-web
          path: ${{ runner.temp }}/report-web.json
          overwrite: true
          if-no-files-found: error

  native:
    needs: [config, report-start]
    if: ${{ !cancelled() && needs.config.result == 'success' && github.event_name == 'push' && needs.config.outputs.native != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.native) }}
    runs-on: ubuntu-24.04
    env:
      EXACT_CACHE_TAGS: ${{ needs.config.outputs.cache }}
      PLATFORM: ${{ matrix.platform }}
      EXACT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - *checkout
      - *shared
      - *bun
      - run: bash "$CI_SCRIPTS/setup.sh" "$PLATFORM" checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_REF: ${{ needs.config.outputs.exact }}
      - env: { CONVEX_DEPLOY_KEY: '${{ secrets.CONVEX_DEPLOY_KEY }}' }
        run: bash "$CI_SCRIPTS/web.sh" origins
      - working-directory: apps/apps
        run: |
          mkdir -p .exact
          ln -s "$EXACT" .exact/checkout
          bun install --frozen-lockfile
      - id: probe
        working-directory: apps/apps
        env: &production-key { CONVEX_DEPLOY_KEY: '${{ secrets.CONVEX_DEPLOY_KEY }}' }
        run: &plan |
          ci="$GITHUB_WORKSPACE/$CI_SCRIPTS"
          bash "$ci/with-signing.sh" EXACT_UPDATE_SEED bun --no-env-file "$ci/updates.mjs" plan "$PLATFORM"
      - if: steps.probe.outputs.tools == 'true' || steps.probe.outputs.native == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash "$CI_SCRIPTS/setup.sh" web ota
      - id: plan
        if: steps.probe.outputs.tools == 'true'
        working-directory: apps/apps
        env: *production-key
        run: *plan
      - if: &native steps.probe.outputs.native == 'true' || steps.plan.outputs.native == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        working-directory: apps/apps
        run: bash "$GITHUB_WORKSPACE/$CI_SCRIPTS/native.sh" prepare "$PLATFORM" restore
      - if: *native
        working-directory: apps/apps
        env:
          CONVEX_DEPLOY_KEY: ${{ matrix.platform == 'android' && secrets.CONVEX_DEPLOY_KEY || '' }}
        run: |
          ci="$GITHUB_WORKSPACE/$CI_SCRIPTS"
          if [[ "$PLATFORM" == android ]]; then
            bash "$ci/with-signing.sh" ANDROID_APK_SIGNING bash "$ci/native.sh" build "$PLATFORM"
          else
            bash "$ci/native.sh" build "$PLATFORM"
          fi
      - if: *native
        working-directory: apps/apps
        run: bash "$GITHUB_WORKSPACE/$CI_SCRIPTS/native.sh" publish "$PLATFORM"
      - if: *native
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          name=$(echo "$PLATFORM" | tr '[:lower:]' '[:upper:]')
          bun run convex env set "EXACT_INSTALL_$name" --from-file "$RUNNER_TEMP/installer-$PLATFORM.json"
          printf '[Install %s](%s)\n' "$PLATFORM" "$(jq -er .url "$RUNNER_TEMP/installer-$PLATFORM.json")" >> "$GITHUB_STEP_SUMMARY"
      - if: *native
        working-directory: apps/apps
        env: *production-key
        run: |
          ci="$GITHUB_WORKSPACE/$CI_SCRIPTS"
          bash "$ci/with-signing.sh" EXACT_UPDATE_SEED bun --no-env-file "$ci/updates.mjs" seed "$PLATFORM"
      - id: receipt
        if: ${{ always() && needs.config.outputs.report == 'true' }}
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ job.status }}
          PLATFORM: ${{ matrix.platform }}
        run: *receipt
      - if: ${{ always() && steps.receipt.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: exact-deployment-${{ matrix.platform }}
          path: ${{ runner.temp }}/report-${{ matrix.platform }}.json
          overwrite: true
          if-no-files-found: error
  report-finish:
    needs: [config, web, native]
    if: ${{ always() && needs.config.outputs.report == 'true' && (needs.config.outputs.web-platforms != '[]' || (github.event_name == 'push' && needs.config.outputs.native != '[]')) }}
    runs-on: ubuntu-24.04
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: exact-deployment-*
          path: ${{ runner.temp }}/deployment-reports
          merge-multiple: true
      - name: Report platform results
        continue-on-error: true
        env:
          WEB_PLATFORMS: ${{ needs.config.outputs.web-platforms }}
          NATIVE_PLATFORMS: ${{ github.event_name == 'push' && needs.config.outputs.native || '[]' }}
          REPORT_FINISHED: true
        run: *report
