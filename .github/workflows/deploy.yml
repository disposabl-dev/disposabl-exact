name: Deploy app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recipients:
        description: Public keys supplied by the signing setup command
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch'
    uses: disposabl-dev/disposabl-exact/.github/workflows/app.yml@setup-v1.0.0-rc.2
    secrets:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOY_KEY_PREVIEW: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}

  provision-signing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions: {}
    uses: disposabl-dev/disposabl-exact/.github/workflows/signing.yml@setup-v1.0.0-rc.2
    with:
      recipients: ${{ inputs.recipients }}
