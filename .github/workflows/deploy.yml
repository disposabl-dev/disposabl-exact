name: Deploy app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recipients:
        description: Public keys supplied by the signing setup command
        type: string

permissions:
  contents: read

concurrency:
  group: convex-web-${{ github.event_name }}-${{ github.head_ref || 'main' }}
  cancel-in-progress: false

env:
  EXACT_REF: 28f071ca1b04fb4af90af965bab5241fa26d037a
  BUN_VERSION: 1.4.4

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref != 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: ${{ github.event_name == 'push' && 'android-production' || 'android-preview' }}
      deployment: false
    outputs:
      convex_origin: ${{ steps.web.outputs.convex_origin }}
      native_matrix: ${{ steps.native-matrix.outputs.matrix }}
    env:
      EXACT_TOOLS_ORIGIN: none
      EXACT_PR_NUMBER: ${{ github.event.pull_request.number }}
      EXACT_VARIANT: ${{ github.event_name == 'pull_request' && 'preview' || '' }}
      BUILD_WEB: >-
        cd ../../apps/apps &&
        rm -rf dist/convex &&
        env -u CONVEX_DEPLOY_KEY -u EXACT_VARIANT CONVEX_ORIGIN="wss://${VITE_CONVEX_URL#https://}" bun exact.mjs web-build --out dist/convex &&
        rm -f dist/convex/.exact-build.json &&
        printf 'convex_origin=wss://%s\n' "${VITE_CONVEX_URL#https://}" >> "$GITHUB_OUTPUT"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/exact-setup
        with:
          platform: web
          exact-ref: ${{ env.EXACT_REF }}
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install app and backend dependencies
        run: |
          (cd packages/backend && bun install --frozen-lockfile)
          (cd apps/apps && mkdir -p .exact && ln -s "$EXACT" .exact/checkout && bun install --frozen-lockfile)
      - name: Deploy web
        id: web
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ github.event_name == 'push' && secrets.CONVEX_DEPLOY_KEY || secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            IFS=: read -r _ team project <<< "${CONVEX_DEPLOY_KEY%%|*}"
            CONVEX_DEPLOY_KEY=$(curl -fsS https://api.convex.dev/api/claim_preview_deployment \
              -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" \
              --json "$(jq -nc --arg branch "$GITHUB_HEAD_REF" --arg team "$team" --arg project "$project" \
                '{identifier:$branch,reuse:true,projectSelection:{kind:"teamAndProjectSlugs",teamSlug:$team,projectSlug:$project}}')" \
              | jq -er 'select(.deploymentName and .adminKey) | "preview:\(.deploymentName)|\(.adminKey | split("|")[-1])"')
            echo "::add-mask::$CONVEX_DEPLOY_KEY"
          fi
          bun run static-hosting deploy --dist ../../apps/apps/dist/convex --build-command "$BUILD_WEB"
      - name: Publish compatible mobile updates
        id: updates
        env:
          CONVEX_ORIGIN: ${{ steps.web.outputs.convex_origin }}
          EXACT_UPDATE_SEED: ${{ secrets.EXACT_UPDATE_SEED }}
        run: |
          # Exact reads each platform's manifest from disk while baking.
          ios="$RUNNER_TEMP/ios-publisher"
          git worktree add --quiet --detach "$ios" HEAD
          mkdir -p "$ios/apps/apps/.exact"
          ln -s "$EXACT" "$ios/apps/apps/.exact/checkout"
          (cd "$ios/apps/apps" && bun install --frozen-lockfile)
          (cd "$ios/apps/apps" && bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" deliver ios) &
          ios_pid=$!
          status=0
          (cd apps/apps && bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" deliver android) || status=$?
          wait "$ios_pid" || status=$?
          exit "$status"
      - name: Select native builds
        id: native-matrix
        env:
          ANDROID_NATIVE: ${{ steps.updates.outputs.android_native }}
          IOS_NATIVE: ${{ steps.updates.outputs.ios_native }}
          ANDROID_CHANNEL: ${{ steps.updates.outputs.android_channel }}
          IOS_CHANNEL: ${{ steps.updates.outputs.ios_channel }}
        run: |
          [[ "$ANDROID_NATIVE" == true || "$ANDROID_NATIVE" == false ]]
          [[ "$IOS_NATIVE" == true || "$IOS_NATIVE" == false ]]
          [[ "$ANDROID_NATIVE" != true || "$ANDROID_CHANNEL" =~ ^base-[1-9][0-9]*$ ]]
          [[ "$IOS_NATIVE" != true || "$IOS_CHANNEL" =~ ^base-[1-9][0-9]*$ ]]
          matrix=$(jq -cn --arg android "$ANDROID_NATIVE" --arg ios "$IOS_NATIVE" --arg android_channel "$ANDROID_CHANNEL" --arg ios_channel "$IOS_CHANNEL" '
            [if $android == "true" then {platform:"android",channel:$android_channel} else empty end,
             if $ios == "true" then {platform:"ios",channel:$ios_channel} else empty end]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native:
    name: Build ${{ matrix.platform }} ${{ github.event_name == 'push' && 'production' || 'preview' }}
    needs: deploy
    if: needs.deploy.outputs.native_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.deploy.outputs.native_matrix) }}
    runs-on: ${{ matrix.platform == 'ios' && (vars.EXACT_IOS_UBUNTU_RUNNER || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    environment:
      name: ${{ github.event_name == 'push' && 'android-production' || 'android-preview' }}
      deployment: false
    defaults:
      run:
        shell: bash
    env:
      EXACT_TOOLS_ORIGIN: none
      CONVEX_ORIGIN: ${{ needs.deploy.outputs.convex_origin }}
      EXACT_PR_NUMBER: ${{ github.event.pull_request.number }}
      EXACT_VARIANT: ${{ github.event_name == 'pull_request' && 'preview' || '' }}
      EXACT_MOBILE_CHANNEL: ${{ matrix.channel }}
      EXACT_UPDATE_TRUST: production
      EXACT_UPDATE_GENESIS: '1'
      EXACT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/exact-setup
        with:
          platform: ${{ matrix.platform }}
          exact-ref: ${{ env.EXACT_REF }}
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install app dependencies
        working-directory: apps/apps
        run: |
          mkdir -p .exact
          ln -s "$EXACT" .exact/checkout
          bun install --frozen-lockfile
      - name: Configure updates
        working-directory: apps/apps
        env:
          EXACT_UPDATE_SEED: ${{ secrets.EXACT_UPDATE_SEED }}
        run: |
          echo "EXACT_BAKE_OUTPUT=$RUNNER_TEMP/${{ matrix.platform }}-artifacts/bake" >> "$GITHUB_ENV"
          bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" configure "${{ matrix.platform }}"
      - name: Build native artifacts
        id: native-build
        working-directory: apps/apps
        env:
          ANDROID_APK_SIGNING: ${{ secrets.ANDROID_APK_SIGNING }}
          ANDROID_PLAY_UPLOAD_SIGNING: ${{ secrets.ANDROID_PLAY_UPLOAD_SIGNING }}
          ANDROID_PLAY_CONNECTED: ${{ vars.ANDROID_PLAY_CONNECTED }}
        run: bash "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/native-build.sh" "${{ matrix.platform }}"
      - name: Upload native artifacts
        if: ${{ !cancelled() && (matrix.platform == 'ios' && success() || matrix.platform == 'android' && steps.native-build.outputs.apk_verified == 'true') }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-${{ github.event_name == 'push' && 'production' || 'preview' }}
          path: |
            ${{ runner.temp }}/${{ matrix.platform }}-artifacts/*.apk
            ${{ runner.temp }}/${{ matrix.platform }}-artifacts/*.aab
            ${{ runner.temp }}/${{ matrix.platform }}-artifacts/*.ipa
            ${{ runner.temp }}/${{ matrix.platform }}-artifacts/*.receipt.json
          if-no-files-found: error
          overwrite: true
      - name: Publish iPhone install link
        if: matrix.platform == 'ios'
        run: bash "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/native-build.sh" ios-link
      - name: Seed update stream
        working-directory: apps/apps
        env:
          EXACT_UPDATE_SEED: ${{ secrets.EXACT_UPDATE_SEED }}
        run: bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" seed "${{ matrix.platform }}"

  provision-signing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate and encrypt missing signing keys
        env:
          RECIPIENTS: ${{ inputs.recipients }}
        run: |
          python3 -m venv "$RUNNER_TEMP/signing"
          "$RUNNER_TEMP/signing/bin/pip" install --quiet PyNaCl==1.6.2
          "$RUNNER_TEMP/signing/bin/python" .github/actions/exact-setup/scripts/setup-signing.py --generate-on-runner
      - uses: actions/upload-artifact@v6
        with:
          name: sealed-keys
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: error
          retention-days: 1
