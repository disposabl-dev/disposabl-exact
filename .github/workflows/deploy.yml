name: Deploy app

on:
  push:
    branches: [main]
    paths-ignore: [.github/workflows/publish.yml]
  workflow_dispatch:
    inputs:
      recipients:
        description: Public keys supplied by the signing setup command
        type: string

permissions:
  contents: read

concurrency:
  group: convex-web-${{ github.event_name }}-main
  queue: max

env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  BUN_VERSION: 1.4.5
  BUNDLE_VERSION: '4'
  IOS_BUNDLE_VERSION: '3'
  EXACT_TOOLS_ORIGIN: none

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: blacksmith-8vcpu-ubuntu-2604
    timeout-minutes: 45
    environment:
      name: android-production
      deployment: false
    outputs:
      convex_origin: ${{ steps.web.outputs.convex_origin }}
      native_matrix: ${{ steps.updates.outputs.matrix }}
    env:
      BUILD_WEB: >-
        cd ../../apps/apps &&
        rm -rf dist/convex &&
        env -u CONVEX_DEPLOY_KEY CONVEX_ORIGIN="wss://${VITE_CONVEX_URL#https://}" bun exact.mjs web-build --out dist/convex &&
        rm -f dist/convex/.exact-build.json &&
        printf 'convex_origin=wss://%s\n' "${VITE_CONVEX_URL#https://}" >> "$GITHUB_OUTPUT"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/exact-setup
        with:
          platform: web
          exact-ref: ${{ env.EXACT_REF }}
          bun-version: ${{ env.BUN_VERSION }}
          bundle-version: ${{ env.BUNDLE_VERSION }}
      - name: Install app and backend dependencies
        run: |
          (cd packages/backend && bun install --frozen-lockfile)
          (cd apps/apps && mkdir -p .exact && ln -s "$EXACT" .exact/checkout && bun install --frozen-lockfile)
      - name: Deploy web
        id: web
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          : "${CONVEX_DEPLOY_KEY:?Set the production CONVEX_DEPLOY_KEY Actions secret}"
          bun run static-hosting deploy --dist ../../apps/apps/dist/convex --build-command "$BUILD_WEB"
      - name: Publish compatible mobile updates
        id: updates
        env:
          CONVEX_ORIGIN: ${{ steps.web.outputs.convex_origin }}
          EXACT_UPDATE_SEED: ${{ secrets.EXACT_UPDATE_SEED }}
        working-directory: apps/apps
        run: bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" plan

  native:
    name: Build ${{ matrix.platform }} production
    needs: deploy
    if: needs.deploy.outputs.native_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.deploy.outputs.native_matrix) }}
    runs-on: ${{ matrix.platform == 'ios' && 'blacksmith-6vcpu-macos-27' || 'blacksmith-8vcpu-ubuntu-2604' }}
    timeout-minutes: 90
    environment:
      name: android-production
      deployment: false
    defaults:
      run:
        shell: bash
    env:
      CONVEX_ORIGIN: ${{ needs.deploy.outputs.convex_origin }}
      EXACT_MOBILE_CHANNEL: ${{ matrix.channel }}
      EXACT_UPDATE_TRUST: production
      EXACT_UPDATE_GENESIS: '1'
      EXACT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/exact-setup
        with:
          platform: ${{ matrix.platform }}
          exact-ref: ${{ env.EXACT_REF }}
          bun-version: ${{ env.BUN_VERSION }}
          bundle-version: ${{ matrix.platform == 'ios' && env.IOS_BUNDLE_VERSION || env.BUNDLE_VERSION }}
      - name: Install app dependencies
        working-directory: apps/apps
        run: |
          mkdir -p .exact
          ln -s "$EXACT" .exact/checkout
          bun install --frozen-lockfile
      - name: Configure updates
        working-directory: apps/apps
        env:
          EXACT_UPDATE_SEED: ${{ secrets.EXACT_UPDATE_SEED }}
        run: |
          echo "EXACT_BAKE_OUTPUT=$RUNNER_TEMP/${{ matrix.platform }}-artifacts/bake" >> "$GITHUB_ENV"
          bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" configure "${{ matrix.platform }}"
      - name: Build native artifacts
        id: native-build
        working-directory: apps/apps
        env:
          ANDROID_APK_SIGNING: ${{ matrix.platform == 'android' && secrets.ANDROID_APK_SIGNING || '' }}
          ANDROID_PLAY_UPLOAD_SIGNING: ${{ matrix.platform == 'android' && vars.ANDROID_PLAY_CONNECTED == 'true' && secrets.ANDROID_PLAY_UPLOAD_SIGNING || '' }}
          ANDROID_PLAY_CONNECTED: ${{ vars.ANDROID_PLAY_CONNECTED }}
        run: bash "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/native-build.sh" "${{ matrix.platform }}"
      - name: Upload native artifacts
        if: ${{ !cancelled() && (matrix.platform == 'ios' && success() || matrix.platform == 'android' && steps.native-build.outputs.apk_verified == 'true') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.platform }}-production
          path: |
            ${{ runner.temp }}/${{ matrix.platform }}-artifacts/*.apk
            ${{ runner.temp }}/${{ matrix.platform }}-artifacts/*.aab
            ${{ runner.temp }}/${{ matrix.platform }}-artifacts/*.ipa
            ${{ runner.temp }}/${{ matrix.platform }}-artifacts/*.receipt.json
          if-no-files-found: error
          overwrite: true
      - name: Publish iPhone install link
        if: matrix.platform == 'ios'
        run: bash "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/native-build.sh" ios-link
      - name: Seed update stream
        working-directory: apps/apps
        env:
          EXACT_UPDATE_SEED: ${{ secrets.EXACT_UPDATE_SEED }}
        run: bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" seed "${{ matrix.platform }}"

  provision-signing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Generate and encrypt missing signing keys
        env:
          RECIPIENTS: ${{ inputs.recipients }}
        run: |
          python3 -m venv "$RUNNER_TEMP/signing"
          "$RUNNER_TEMP/signing/bin/pip" install --quiet PyNaCl==1.6.2
          "$RUNNER_TEMP/signing/bin/python" .github/actions/exact-setup/scripts/setup-signing.py --generate-on-runner
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sealed-keys
          path: ${{ runner.temp }}/sealed/
          if-no-files-found: error
          retention-days: 1
