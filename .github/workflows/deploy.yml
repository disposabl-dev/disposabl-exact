name: Deploy app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recipients:
        description: Public keys supplied by the signing setup command
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch'
    uses: disposabl-dev/exact-setup/.github/workflows/deploy.yml@a6eaaba8ee6d34839818aa0f8047f4286af61a51
    secrets:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOY_KEY_PREVIEW: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}

  provision-signing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions: {}
    uses: disposabl-dev/exact-setup/.github/workflows/signing.yml@a6eaaba8ee6d34839818aa0f8047f4286af61a51
    with:
      recipients: ${{ inputs.recipients }}
