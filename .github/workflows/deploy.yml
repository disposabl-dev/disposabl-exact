name: Deploy app
on:
  workflow_call:
    secrets:
      ANDROID_APK_SIGNING: { required: false }
      EXACT_UPDATE_SEED: { required: false }
      CONVEX_DEPLOY_KEY: { required: false }
      CONVEX_DEPLOY_KEY_PREVIEW: { required: false }
  pull_request:
    paths-ignore: &generator-only ['packages/create-disposabl-app/**', '.github/workflows/create-disposabl-app.yml']
  push:
    branches: [main]
    paths-ignore: *generator-only
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  EXACT_FEEDBACK: '0'
  CI_SCRIPTS: ${{ github.repository == 'disposabl-dev/disposabl-exact' && '.github/ci' || '.disposabl-ci/.github/ci' }}
jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.platforms.outputs.web }}
      native: ${{ steps.platforms.outputs.native }}
      exact: ${{ steps.platforms.outputs.exact }}
      cache: ${{ steps.platforms.outputs.cache }}
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - &bun
        uses: oven-sh/setup-bun@v2.2.0
        with: { bun-version: '1.4.5' }
      - id: platforms
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          repo=disposabl-dev/disposabl-exact
          tag=$(gh release list -R "$repo" --limit 100 --exclude-drafts --json tagName --jq '[.[].tagName | select(startswith("exact-ci-linux-v3-"))] | sort_by(split("-")[-2:] | map(tonumber)) | last // empty')
          if [[ -z "$tag" ]]; then
            # Bootstrap the publisher's first release.
            ref=$(git ls-remote https://github.com/expo/exact.git refs/heads/main | cut -f1)
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          else
            [[ "$tag" =~ ^exact-ci-linux-v3-([0-9a-f]{40})-[0-9]+-[0-9]+$ ]]
            ref=${BASH_REMATCH[1]}
          fi
          printf 'exact=%s\ncache=%s\n' "$ref" "$tag" >> "$GITHUB_OUTPUT"
          bun -e 'import {platform as p} from "./packages/disposabl-kit/server/platform.ts"; console.log("web="+p.web); console.log("native="+JSON.stringify([...p.mobile,...(p.macos?["macos"]:[])]))' >> "$GITHUB_OUTPUT"
  web:
    needs: config
    if: github.event_name == 'push' || needs.config.outputs.web == 'true'
    env: { EXACT_CACHE_TAG: '${{ needs.config.outputs.cache }}' }
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - &shared
        if: github.repository != 'disposabl-dev/disposabl-exact'
        uses: actions/checkout@v7.0.1
        with:
          repository: disposabl-dev/disposabl-exact
          ref: main
          path: .disposabl-ci
          sparse-checkout: .github/ci
          persist-credentials: false
      - *bun
      - if: needs.config.outputs.web == 'true'
        env: { GH_TOKEN: '${{ github.token }}', EXACT_REF: '${{ needs.config.outputs.exact }}' }
        run: bash "$CI_SCRIPTS/setup.sh" web
      - env:
          WEB: ${{ needs.config.outputs.web }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BUILD_ONLY: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
          CONVEX_DEPLOY_KEY: ${{ secrets[github.event_name == 'pull_request' && 'CONVEX_DEPLOY_KEY_PREVIEW' || 'CONVEX_DEPLOY_KEY'] }}
        run: bash "$CI_SCRIPTS/web.sh"

  native:
    needs: config
    if: github.event_name == 'push' && needs.config.outputs.native != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.native) }}
    runs-on: ubuntu-24.04
    environment: { name: android-production, deployment: false }
    env:
      EXACT_CACHE_TAG: ${{ needs.config.outputs.cache }}
      PLATFORM: ${{ matrix.platform }}
      EXACT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - *checkout
      - *shared
      - *bun
      - run: bash "$CI_SCRIPTS/setup.sh" "$PLATFORM" checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_REF: ${{ needs.config.outputs.exact }}
      - env: { CONVEX_DEPLOY_KEY: '${{ secrets.CONVEX_DEPLOY_KEY }}' }
        run: bash "$CI_SCRIPTS/web.sh" origins
      - working-directory: apps/apps
        run: |
          mkdir -p .exact
          ln -s "$EXACT" .exact/checkout
          bun install --frozen-lockfile
      - id: probe
        working-directory: apps/apps
        env: &update-key { EXACT_UPDATE_SEED: '${{ secrets.EXACT_UPDATE_SEED }}' }
        run: &plan bun --no-env-file "$GITHUB_WORKSPACE/$CI_SCRIPTS/updates.mjs" plan "$PLATFORM"
      - if: steps.probe.outputs.tools == 'true' || steps.probe.outputs.native == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash "$CI_SCRIPTS/setup.sh" web ota
      - id: plan
        if: steps.probe.outputs.tools == 'true'
        working-directory: apps/apps
        env: *update-key
        run: *plan
      - if: &native steps.probe.outputs.native == 'true' || steps.plan.outputs.native == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        working-directory: apps/apps
        run: bash "$GITHUB_WORKSPACE/$CI_SCRIPTS/native.sh" prepare "$PLATFORM" restore
      - if: *native
        working-directory: apps/apps
        env:
          ANDROID_APK_SIGNING: ${{ matrix.platform == 'android' && secrets.ANDROID_APK_SIGNING || '' }}
        run: bash "$GITHUB_WORKSPACE/$CI_SCRIPTS/native.sh" build "$PLATFORM"
      - if: *native
        working-directory: apps/apps
        run: bash "$GITHUB_WORKSPACE/$CI_SCRIPTS/native.sh" publish "$PLATFORM"
      - if: *native
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          name=$(echo "$PLATFORM" | tr '[:lower:]' '[:upper:]')
          bun run convex env set "EXACT_INSTALL_$name" --from-file "$RUNNER_TEMP/installer-$PLATFORM.json"
          printf '[Install %s](%s)\n' "$PLATFORM" "$(jq -er .url "$RUNNER_TEMP/installer-$PLATFORM.json")" >> "$GITHUB_STEP_SUMMARY"
      - if: *native
        working-directory: apps/apps
        env: *update-key
        run: bun --no-env-file "$GITHUB_WORKSPACE/$CI_SCRIPTS/updates.mjs" seed "$PLATFORM"
