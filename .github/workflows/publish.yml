name: Publish shared Exact tools
on:
  workflow_dispatch:
    inputs:
      exact-ref:
        required: true
        default: 28f071ca1b04fb4af90af965bab5241fa26d037a
      bun-version:
        required: true
        default: '1.4.4'
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'disposabl-dev/disposabl-exact' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/exact-setup
        with:
          mode: build
          platform: ${{ matrix.platform }}
          exact-ref: ${{ inputs.exact-ref }}
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/exact-*.tar.zst*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: bundles
          merge-multiple: true
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXACT_REF: ${{ inputs.exact-ref }}
          BUN_VERSION: ${{ inputs.bun-version }}
        run: |
          [[ "$EXACT_REF" =~ ^[0-9a-f]{40}$ && "$BUN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd bundles
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          gh release create --target "$GITHUB_SHA" "v2-exact-${EXACT_REF}-bun-${BUN_VERSION}" --title "Exact ${EXACT_REF} / Bun ${BUN_VERSION}" --notes 'App-independent Exact setup bundles.' ./*
