name: Build Exact setup bundles
on:
  workflow_call:
    inputs:
      exact-ref:
        required: false
        type: string
        default: 28f071ca1b04fb4af90af965bab5241fa26d037a
      bun-version:
        required: false
        type: string
        default: '1.4.4'
  workflow_dispatch:
    inputs:
      exact-ref:
        description: Full Exact commit SHA
        required: true
      bun-version:
        description: Bun version
        default: '1.4.4'
        required: true
permissions:
  contents: read
jobs:
  build:
    outputs:
      format: ${{ steps.format.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            runner: ubuntu-24.04
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      SETUP_PLATFORM: ${{ matrix.platform }}
      SETUP_EXACT_REF: ${{ inputs.exact-ref }}
      SETUP_BUN_VERSION: ${{ inputs.bun-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/checkout@v6
        with:
          repository: expo/exact
          ref: ${{ inputs.exact-ref }}
          path: .exact-sdk
          persist-credentials: false
      - name: Validate pin and configure environment
        id: format
        shell: bash
        run: |
          [[ "$SETUP_EXACT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SETUP_BUN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          format=$(cat bundle-version)
          [[ "$format" =~ ^[1-9][0-9]*$ ]]
          echo "version=$format" >> "$GITHUB_OUTPUT"
          exact="$RUNNER_TEMP/exact-sdk"
          mv "$GITHUB_WORKSPACE/.exact-sdk" "$exact"
          ln -s "$exact" "$GITHUB_WORKSPACE/.exact-sdk"
          test "$(git -C "$exact" rev-parse HEAD)" = "$SETUP_EXACT_REF"
          echo "EXACT=$exact" >> "$GITHUB_ENV"
          if [[ "$SETUP_PLATFORM" == ios && -d /Applications/Xcode_27.2.app/Contents/Developer ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          if ! command -v zstd >/dev/null; then
            if [[ "$RUNNER_OS" == macOS ]]; then brew install zstd; else sudo apt-get update && sudo apt-get install -y zstd; fi
          fi
      - run: bash scripts/setup.sh
        shell: bash
      - run: bash scripts/pack.sh
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/exact-*.tar.zst
            ${{ runner.temp }}/exact-*.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: bundles
          merge-multiple: true
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORMAT: ${{ needs.build.outputs.format }}
          EXACT_REF: ${{ inputs.exact-ref }}
          BUN_VERSION: ${{ inputs.bun-version }}
        shell: bash
        run: |
          [[ "$EXACT_REF" =~ ^[0-9a-f]{40}$ && "$BUN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd bundles
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          gh release create --target "$GITHUB_SHA" "v${FORMAT}-exact-${EXACT_REF}-bun-${BUN_VERSION}" --title "Exact ${EXACT_REF} / Bun ${BUN_VERSION}" --notes 'App-independent Exact setup bundles.' ./*
