name: Publish shared Exact tools
on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - .github/workflows/publish.yml
      - .github/actions/exact-setup/**

permissions:
  contents: read

env:
  EXACT_REF: 28f071ca1b04fb4af90af965bab5241fa26d037a
  BUN_VERSION: 1.4.4

jobs:
  version:
    if: github.repository == 'disposabl-dev/disposabl-exact' && github.event.pull_request.merged
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      missing: ${{ steps.release.outputs.missing }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v2-exact-${EXACT_REF}-bun-${BUN_VERSION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          case "$status" in
            200) echo 'missing=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'missing=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::GitHub release lookup returned $status"; exit 1 ;;
          esac

  build:
    needs: version
    if: needs.version.outputs.missing == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/exact-setup
        with:
          mode: build
          platform: ${{ matrix.platform }}
          exact-ref: ${{ env.EXACT_REF }}
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/exact-*.tar.zst*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  release:
    needs: [version, build]
    concurrency: publish-${{ needs.version.outputs.tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: bundles
          merge-multiple: true
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd bundles
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create --target "$GITHUB_SHA" "$TAG" --title "Exact ${EXACT_REF} / Bun ${BUN_VERSION}" --notes 'App-independent Exact setup bundles.' ./*
