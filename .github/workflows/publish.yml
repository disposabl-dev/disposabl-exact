name: Publish shared Exact tools
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish.yml]
permissions:
  actions: read
  contents: write
  pull-requests: read
jobs:
  release:
    if: github.repository == 'disposabl-dev/disposabl-exact'
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: b83240f3c7935bc7f0a4205d4ea19ad5ce8b4c60
      SOURCE_RUN: '44989286211'
      TAG: v2-exact-28f071ca1b04fb4af90af965bab5241fa26d037a-bun-1.4.4
    steps:
      - name: Verify the merged recovery PR and original build
        run: |
          gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" | jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .merged_at and .base.ref == "main" and .merge_commit_sha == $sha)'
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha | grep -Fx "$SOURCE_SHA"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha | grep -Fx "$SOURCE_SHA"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/attempts/1/jobs" | jq -e '[.jobs[] | select((.name | startswith("publish / build (")) and .conclusion == "success")] | length == 3'
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: bundle-*
          merge-multiple: true
          path: bundles
      - name: Verify and publish the original Ubuntu bundles
        working-directory: bundles
        run: |
          for platform in web android ios; do
            archive="exact-28f071ca1b04fb4af90af965bab5241fa26d037a-$platform-Linux-X64-bun-1.4.4.tar.zst"
            test -s "$archive"
            sha256sum --check "$archive.sha256"
          done
          gh release create "$TAG" --verify-tag --title "Exact 28f071ca1b04 / Bun 1.4.4" --notes "Ubuntu x64 tools built by GitHub Actions run $SOURCE_RUN at $SOURCE_SHA." ./*.tar.zst ./*.sha256
