name: Publish shared Exact tools
on:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - .github/workflows/deploy.yml
      - .github/actions/exact-setup/**
  workflow_call:

concurrency:
  group: publish-exact-tools-${{ github.event.pull_request.number || 'main' }}
  queue: max

permissions:
  contents: read

env:
  BASE_TOOLS_VERSION: '5'

jobs:
  version:
    if: >-
      github.repository == 'disposabl-dev/disposabl-exact' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: blacksmith-2vcpu-ubuntu-2604
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      missing: ${{ steps.release.outputs.missing }}
      reuse: ${{ steps.release.outputs.reuse }}
      exact-ref: ${{ steps.pin.outputs.exact-ref }}
      bun-version: ${{ steps.pin.outputs.bun-version }}
      bundle-version: ${{ steps.pin.outputs.bundle-version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: cat .github/actions/exact-setup/pin.env >> "$GITHUB_OUTPUT"
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_REF: ${{ steps.pin.outputs.exact-ref }}
          BUN_VERSION: ${{ steps.pin.outputs.bun-version }}
          BUNDLE_VERSION: ${{ steps.pin.outputs.bundle-version }}
        run: |
          tag="v${BUNDLE_VERSION}-exact-${EXACT_REF}-bun-${BUN_VERSION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          status=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          case "$status" in
            200)
              python3 .github/actions/exact-setup/scripts/release-manifest.py \
                "$BUNDLE_VERSION" "$EXACT_REF" "$BUN_VERSION" "$RUNNER_TEMP/exact-inputs.json"
              echo 'missing=false' >> "$GITHUB_OUTPUT" ;;
            404)
              base="v${BASE_TOOLS_VERSION}-exact-${EXACT_REF}-bun-${BUN_VERSION}"
              base_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$base")
              case "$base_status" in
                200) echo 'reuse=true' >> "$GITHUB_OUTPUT" ;;
                404) echo 'reuse=false' >> "$GITHUB_OUTPUT" ;;
                *) echo "::error::Base tool lookup returned $base_status"; exit 1 ;;
              esac
              echo 'missing=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::GitHub release lookup returned $status"; exit 1 ;;
          esac

  build:
    needs: version
    if: needs.version.outputs.missing == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android, ios]
    runs-on: ${{ matrix.platform == 'ios' && 'blacksmith-6vcpu-macos-27' || 'blacksmith-8vcpu-ubuntu-2604' }}
    timeout-minutes: 120
    env:
      EXACT_REF: ${{ needs.version.outputs.exact-ref }}
      BUN_VERSION: ${{ needs.version.outputs.bun-version }}
      BUNDLE_VERSION: ${{ needs.version.outputs.bundle-version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v4.0.4
        if: matrix.platform == 'android'
        with:
          packages: platforms;android-37.2 build-tools;37.0.0 ndk;27.3.13750724
      - uses: ./.github/actions/exact-setup
        with:
          mode: ${{ needs.version.outputs.reuse == 'true' && 'consume' || 'build' }}
          bundle-version: ${{ needs.version.outputs.reuse == 'true' && env.BASE_TOOLS_VERSION || env.BUNDLE_VERSION }}
          platform: ${{ matrix.platform }}
          exact-ref: ${{ env.EXACT_REF }}
          bun-version: ${{ env.BUN_VERSION }}
      - name: Prepare public build inputs
        env:
          PLATFORM: ${{ matrix.platform }}
          EXACT_TOOLS_ORIGIN: none
          EXACT_UPDATE_TRUST: production
          EXACT_UPDATE_GENESIS: '1'
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_BALANCED_LTO: 'off'
          CARGO_PROFILE_SIZE_LTO: 'off'
        run: |
          if [[ "$PLATFORM" == android ]]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          fi
          bash .github/actions/exact-setup/scripts/publish-inputs.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/kit-out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  release:
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.missing == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      contents: write
    env:
      EXACT_REF: ${{ needs.version.outputs.exact-ref }}
      BUN_VERSION: ${{ needs.version.outputs.bun-version }}
      BUNDLE_VERSION: ${{ needs.version.outputs.bundle-version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        working-directory: bundles
        run: |
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          python3 ../.github/actions/exact-setup/scripts/release-manifest.py \
            "$BUNDLE_VERSION" "$EXACT_REF" "$BUN_VERSION" inputs.json --assets .
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Exact ${EXACT_REF} / Bun ${BUN_VERSION}" --notes 'App-independent Exact setup bundles.' ./*
