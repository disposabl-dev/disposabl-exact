name: Localization

on:
  pull_request:
    paths:
      - apps/apps/**
      - .github/workflows/deploy.yml
      - .github/workflows/localization.yml

permissions:
  contents: read

jobs:
  localization:
    name: Check translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned Exact parser
        run: |
          ref=$(awk '/^  EXACT_REF: / {print $2}' .github/workflows/deploy.yml)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          sdk=apps/apps/.exact/checkout
          git init "$sdk"
          git -C "$sdk" fetch --depth=1 https://github.com/expo/exact.git "$ref"
          git -C "$sdk" checkout --detach FETCH_HEAD
          rust=$(awk -F'"' '/^channel = / {print $2}' "$sdk/rust-toolchain.toml")
          rustup toolchain install "$rust" --profile minimal
          echo "EXACT_RUST=$rust" >> "$GITHUB_ENV"
      - name: Check Contract copy and catalog coverage
        run: |
          manifest=apps/apps/tools/localization/Cargo.toml
          cargo +"$EXACT_RUST" test --locked --manifest-path "$manifest"
          cargo +"$EXACT_RUST" run --locked --manifest-path "$manifest"
