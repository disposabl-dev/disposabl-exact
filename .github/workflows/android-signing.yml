name: Set up Android signing

on:
  workflow_dispatch:
    inputs:
      target:
        description: Signing key to create
        type: choice
        required: true
        options:
          - production
          - play-upload
      environment_key:
        description: GitHub environment public key JSON for encrypted export
        type: string
        required: false

permissions: {}

concurrency:
  group: android-signing
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main' && inputs.environment_key == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: android-production
    steps:
      - name: Generate and store the signing key
        id: signing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ANDROID_SIGNING_SETUP_TOKEN }}
          PLAY_UPLOAD_SIGNING: ${{ secrets.ANDROID_PLAY_UPLOAD_SIGNING }}
          TARGET: ${{ inputs.target }}
        run: |
          secret=ANDROID_APK_SIGNING
          case "$TARGET" in
            production) ;;
            play-upload) secret=ANDROID_PLAY_UPLOAD_SIGNING ;;
            *) exit 1 ;;
          esac

          signing_dir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          keystore="$signing_dir/signing.p12"

          if [[ "$TARGET" == play-upload && -n "$PLAY_UPLOAD_SIGNING" ]]; then
            KEYSTORE_PASSWORD=$(jq -er '.password' <<< "$PLAY_UPLOAD_SIGNING")
            echo "::add-mask::$KEYSTORE_PASSWORD"
            export KEYSTORE_PASSWORD
            jq -er '.keystore' <<< "$PLAY_UPLOAD_SIGNING" | base64 --decode > "$keystore"
          else
            if [[ -z "$GH_TOKEN" ]]; then
              echo "::error::Set ANDROID_SIGNING_SETUP_TOKEN on the android-production environment"
              exit 1
            fi
            existing=$(gh secret list --repo "$GITHUB_REPOSITORY" --env android-production --json name --jq '.[].name')
            if grep -Fxq "$secret" <<< "$existing"; then
              echo "$secret already exists in android-production"
              exit 0
            fi

            KEYSTORE_PASSWORD=$(openssl rand -hex 32)
            echo "::add-mask::$KEYSTORE_PASSWORD"
            export KEYSTORE_PASSWORD
            keytool -genkeypair -storetype PKCS12 -keystore "$keystore" -alias android \
              -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=$GITHUB_REPOSITORY ($TARGET)" -noprompt

            base64 -w0 "$keystore" | jq -Rc '{keystore: ., password: env.KEYSTORE_PASSWORD}' |
              gh secret set "$secret" --repo "$GITHUB_REPOSITORY" --env android-production
          fi

          if [[ "$TARGET" == play-upload ]]; then
            keytool -exportcert -rfc -keystore "$keystore" -alias android \
              -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/android-play-upload.pem"
            echo 'play_certificate=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the public Play certificate
        if: steps.signing.outputs.play_certificate == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: android-play-upload-certificate
          path: ${{ runner.temp }}/android-play-upload.pem
          if-no-files-found: error

  seal:
    if: inputs.environment_key != '' && inputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Generate the production key and encrypt it for GitHub
        env:
          ENVIRONMENT_KEY: ${{ inputs.environment_key }}
        run: |
          python3 -m venv "$RUNNER_TEMP/signing-tools"
          "$RUNNER_TEMP/signing-tools/bin/pip" install --quiet --disable-pip-version-check PyNaCl==1.6.2
          "$RUNNER_TEMP/signing-tools/bin/python" - <<'PYTHON'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import secrets
          import subprocess
          import tempfile

          from nacl.public import PublicKey, SealedBox

          recipient = json.loads(os.environ["ENVIRONMENT_KEY"])
          box = SealedBox(PublicKey(base64.b64decode(recipient["key"], validate=True)))
          password = secrets.token_hex(32)
          keytool_env = dict(os.environ, KEYSTORE_PASSWORD=password)
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
              keystore = Path(directory, "signing.p12")
              subprocess.run([
                  "keytool", "-genkeypair", "-storetype", "PKCS12",
                  "-keystore", str(keystore), "-alias", "android",
                  "-storepass:env", "KEYSTORE_PASSWORD", "-keypass:env", "KEYSTORE_PASSWORD",
                  "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
                  "-dname", "CN=" + os.environ["GITHUB_REPOSITORY"] + " (production)", "-noprompt",
              ], env=keytool_env, check=True)
              payload = json.dumps({
                  "keystore": base64.b64encode(keystore.read_bytes()).decode(),
                  "password": password,
              }, separators=(",", ":")).encode()
              encrypted = box.encrypt(payload)
              certificate = subprocess.check_output([
                  "keytool", "-exportcert", "-keystore", str(keystore), "-alias", "android",
                  "-storepass:env", "KEYSTORE_PASSWORD",
              ], env=keytool_env)

          Path(os.environ["RUNNER_TEMP"], "sealed-signing.json").write_text(json.dumps({
              "key_id": recipient["key_id"],
              "encrypted_value": base64.b64encode(encrypted).decode(),
          }))
          print("Production signing certificate SHA-256:", hashlib.sha256(certificate).hexdigest())
          PYTHON

      - name: Upload the encrypted secret
        uses: actions/upload-artifact@v6
        with:
          name: android-production-signing-encrypted
          path: ${{ runner.temp }}/sealed-signing.json
          if-no-files-found: error
          retention-days: 1
