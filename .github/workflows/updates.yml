name: Publish Exact updates
on:
  push:
    branches: [main]
    paths: ['apps/**']
  workflow_run:
    workflows: [Exact builds]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional full SHA of a completed native base build
        type: string
      repair_platform:
        description: Platform of a completed automatic repair
        type: string
      repair_tag:
        description: Release containing the replacement receipt and binary
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: >-
      vars.EXACT_OTA_ENABLED == 'true' &&
      ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[native]')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.display_title, '[native]')))
    runs-on: ubuntu-24.04
    concurrency:
      group: exact-update-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      actions: write
    env:
      REPAIR_PLATFORM: ${{ inputs.repair_platform }}
      REPAIR_TAG: ${{ inputs.repair_tag }}
      BASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.base_sha }}
      EXACT_REF: f40a26b9d7c07b5a38de9ded2e5a82c65d920ab0
      EXACT_FEEDBACK: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/cache@v5
        with:
          key: exact-publisher-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.EXACT_REF }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.cache/exact/web-modules
            ~/exact-update-work/classifier
            ~/exact-update-work/exact/target
            ~/exact-update-work/project/apps/apps/target/push-tools
      - name: Prepare publisher
        run: |
          root="$HOME/exact-update-work"
          export EXACT="$root/exact"
          mkdir -p "$EXACT" "$root/project"
          git init -q "$EXACT"
          git -C "$EXACT" fetch -q --depth 1 https://github.com/expo/exact.git "$EXACT_REF"
          git -C "$EXACT" checkout -q --detach FETCH_HEAD
          git -C "$EXACT" ls-files -z | (cd "$EXACT" && xargs -0 touch -h -d "@$(git log -1 --format=%ct)")
          git -C "$root/project" init -q
          git -C "$root/project" fetch -q "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)"
          git -C "$root/project" checkout -q --detach FETCH_HEAD
          git clone -q --no-hardlinks "$GITHUB_WORKSPACE" "$root/routing"
          (cd "$EXACT" && CHROME=$(command -v google-chrome) bun scripts/exact.mjs setup --platform web && cargo run --locked --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target x86_64-unknown-linux-gnu)
          echo "EXACT=$EXACT" >> "$GITHUB_ENV"
          echo "CLASSIFIER_APP=$root/routing/apps/apps" >> "$GITHUB_ENV"
          echo "APP_DIR=$root/project/apps/apps" >> "$GITHUB_ENV"
      - name: Sign and publish web and phone updates
        env:
          EXACT_OTA_SIGNING_KEY: ${{ secrets.EXACT_OTA_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-updates.sh
