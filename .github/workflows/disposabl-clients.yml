name: Publish Disposabl CLI or SDK

on:
  workflow_dispatch:
    inputs:
      package:
        description: Disposabl management API client
        type: choice
        options: [cli, sdk]
        required: true
      version:
        description: New npm version (major.minor.patch)
        type: string
        required: true
      source_sha:
        description: Full commit SHA on create-disposabl-app main
        type: string
        required: true
      publish:
        description: Publish to npm after validating the package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    if: github.repository == 'disposabl-dev/disposabl-exact' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: disposabl-dev/create-disposabl-app
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and release version
        run: |
          [[ "$PACKAGE" == cli || "$PACKAGE" == sdk ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
          echo "Source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Build and pack the management API client
        env:
          DISPOSABL_CLI_POSTHOG_PROJECT_TOKEN: ${{ vars.DISPOSABL_CLI_POSTHOG_PROJECT_TOKEN }}
          DISPOSABL_CLI_POSTHOG_HOST: ${{ vars.DISPOSABL_CLI_POSTHOG_HOST }}
          DISPOSABL_CLI_TELEMETRY_REQUIRED: "1"
          DO_NOT_TRACK: "1"
        run: |
          cd "packages/$PACKAGE"
          [[ "$(node -p 'require("./package.json").name')" == "@disposabl/$PACKAGE" ]]
          npm pkg set "version=$VERSION" "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" --workspaces=false
          bun run typecheck
          bun run build
          pack_dir="$RUNNER_TEMP/client"
          mkdir -p "$pack_dir"
          npm pack --pack-destination "$pack_dir" --json > "$pack_dir/package.json"
          mv "$pack_dir/$(node -p 'require(process.argv[1])[0].filename' "$pack_dir/package.json")" "$pack_dir/client.tgz"
          cd "$(mktemp -d)"
          npm install --ignore-scripts --no-audit --no-fund "$pack_dir/client.tgz"
          if [[ "$PACKAGE" == cli ]]; then
            ./node_modules/.bin/disposabl --help
          else
            node --input-type=module -e 'if (typeof (await import("@disposabl/sdk")).client !== "object") process.exit(1)'
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ inputs.package }}
          path: ${{ runner.temp }}/client
          if-no-files-found: error

  publish:
    needs: pack
    if: inputs.publish && github.repository == 'disposabl-dev/disposabl-exact' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-disposabl-${{ inputs.package }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: npm-${{ inputs.package }}
          path: ${{ runner.temp }}/client
      - run: bash .github/scripts/publish-client.sh "$RUNNER_TEMP/client"
