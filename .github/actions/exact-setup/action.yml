name: Exact setup
description: Restore the published Exact build caches, or build the tools for a new release.
inputs:
  platform:
    description: web, android, ios, or ios-linux
    required: true
  exact-ref:
    description: Exact SDK commit SHA
    required: true
  bun-version:
    description: Bun version
    default: '1.4.5'
  bundle-version:
    description: Published setup bundle version
    default: '10'
  bun-ready:
    description: Bun is already installed at the selected version
    default: 'false'
  mode:
    description: consume a published bundle or build its tools
    default: consume
outputs:
  exact-path:
    description: Path to the Exact SDK
    value: ${{ steps.setup.outputs.exact-path }}
  source:
    description: cache or release
    value: ${{ steps.setup.outputs.source }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2.2.0
      if: inputs.bun-ready != 'true'
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/checkout@v7.0.1
      if: inputs.mode == 'build'
      with:
        repository: expo/exact
        ref: ${{ inputs.exact-ref }}
        path: .exact-sdk
        persist-credentials: false
    - name: Cache the web tools archive
      if: inputs.mode == 'consume' && inputs.platform == 'web'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/exact-bundles
        key: exact-bundle-v${{ inputs.bundle-version }}-${{ runner.os }}-${{ runner.arch }}-disposabl-dev/disposabl-exact-web-${{ inputs.exact-ref }}-bun-${{ inputs.bun-version }}
    - id: android-sdk
      if: inputs.platform == 'android'
      shell: bash
      run: |
        if [[ ! -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
          echo 'install=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: android-actions/setup-android@v4.0.4
      if: steps.android-sdk.outputs.install == 'true'
    - name: Set up Exact
      id: setup
      shell: bash
      env:
        SETUP_PLATFORM: ${{ inputs.platform }}
        SETUP_EXACT_REF: ${{ inputs.exact-ref }}
        SETUP_BUN_VERSION: ${{ inputs.bun-version }}
        SETUP_BUNDLE_VERSION: ${{ inputs.bundle-version }}
        SETUP_MODE: ${{ inputs.mode }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
