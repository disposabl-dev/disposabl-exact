name: Exact setup
description: Install or publish pinned Exact tools for the selected runner
inputs:
  platform:
    required: true
    description: web, android, or ios
  exact-ref:
    required: true
    description: Full Exact commit SHA
  bun-version:
    default: '1.4.5'
    description: Bun version
  bundle-version:
    description: Published setup bundle version
    default: '2'
  mode:
    default: consume
    description: consume a release or build its bundle
outputs:
  exact-path:
    value: ${{ steps.checkout-exact.outputs.exact-path }}
    description: Path to Exact checkout
  source:
    value: ${{ steps.consume.outputs.source }}
    description: cache or release
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/checkout@v7.0.1
      with:
        repository: expo/exact
        ref: ${{ inputs.exact-ref }}
        path: .exact-sdk
        persist-credentials: false
    - id: checkout-exact
      shell: bash
      env:
        SETUP_PLATFORM: ${{ inputs.platform }}
        SETUP_EXACT_REF: ${{ inputs.exact-ref }}
        SETUP_BUN_VERSION: ${{ inputs.bun-version }}
        SETUP_MODE: ${{ inputs.mode }}
      run: |
        case "$SETUP_PLATFORM:$RUNNER_OS:$RUNNER_ARCH" in
          web:Linux:X64|android:Linux:X64|ios:Linux:X64) ;;
          *) echo "::error::Unexpected runner for $SETUP_PLATFORM"; exit 1 ;;
        esac
        [[ "$SETUP_MODE" =~ ^(consume|build)$ ]]
        [[ "$SETUP_EXACT_REF" =~ ^[0-9a-f]{40}$ && "$SETUP_BUN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        exact="$RUNNER_TEMP/exact-sdk"
        mv "$GITHUB_WORKSPACE/.exact-sdk" "$exact"
        ln -s "$exact" "$GITHUB_WORKSPACE/.exact-sdk"
        [[ $(git -C "$exact" rev-parse HEAD) == "$SETUP_EXACT_REF" ]]
        echo "EXACT=$exact" >> "$GITHUB_ENV"
        echo "exact-path=$exact" >> "$GITHUB_OUTPUT"
    - name: Restore Exact bundle
      if: inputs.mode == 'consume'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/exact-bundles
        key: exact-bundle-v${{ inputs.bundle-version }}-${{ runner.os }}-${{ runner.arch }}-disposabl-dev/disposabl-exact-${{ inputs.platform }}-${{ inputs.exact-ref }}-bun-${{ inputs.bun-version }}
    - id: android-sdk
      if: inputs.mode == 'consume' && inputs.platform == 'android'
      shell: bash
      run: |
        if [[ -z "${ANDROID_HOME:-}" || ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
          echo "install=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: android-actions/setup-android@v4.0.4
      if: steps.android-sdk.outputs.install == 'true'
    - id: consume
      if: inputs.mode == 'consume'
      shell: bash
      env:
        SETUP_PLATFORM: ${{ inputs.platform }}
        SETUP_EXACT_REF: ${{ inputs.exact-ref }}
        SETUP_BUN_VERSION: ${{ inputs.bun-version }}
        SETUP_BUNDLE_VERSION: ${{ inputs.bundle-version }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/consume.sh"
    - name: Build bundle
      if: inputs.mode == 'build'
      shell: bash
      env:
        SETUP_PLATFORM: ${{ inputs.platform }}
        SETUP_EXACT_REF: ${{ inputs.exact-ref }}
        SETUP_BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/setup.sh"
        bash "$GITHUB_ACTION_PATH/scripts/pack.sh"
    - name: Check iPhone device toolchain
      if: inputs.mode == 'consume' && inputs.platform == 'ios'
      shell: bash
      run: cd "$EXACT" && bun scripts/exact.mjs setup --check --platform ios --device
