name: Deploy app
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    uses: disposabl-dev/disposabl-exact/.github/workflows/deploy.yml@main
    secrets:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOY_KEY_PREVIEW: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
      EXACT_UPDATE_SEED: ${{ secrets.EXACT_UPDATE_SEED }}
      ANDROID_APK_SIGNING: ${{ secrets.ANDROID_APK_SIGNING }}
