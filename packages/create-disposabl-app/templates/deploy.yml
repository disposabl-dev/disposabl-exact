name: Deploy app
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    permissions: { contents: read, id-token: write }
    uses: disposabl-dev/disposabl-exact/.github/workflows/deploy-managed.yml@main
    secrets:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOY_KEY_PREVIEW: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
